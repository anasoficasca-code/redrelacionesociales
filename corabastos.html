<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corabastos · dinámica actual y propuesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F2EC;--ink:#141414;--soft:#55524B;--mute:#8A867C;--line:#D9D5CB;--ui:'Instrument Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box;font-style:normal}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr);height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line)}
header .k{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#C8322B}
header h1{margin:2px 0 0;font-size:21px;letter-spacing:-.015em}
.nav{margin-left:auto;display:flex;gap:6px;align-items:center}
.nav button{border:1px solid #cfcabd;background:#fff;color:var(--soft);border-radius:999px;padding:8px 14px;font:600 13px var(--ui);cursor:pointer}
.nav button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
main{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
#st{width:100%;height:100%;display:block}
aside{border-left:1px solid var(--line);overflow-y:auto;padding:18px 20px;background:#EFECE4}
aside h2{margin:0 0 6px;font-size:20px;letter-spacing:-.01em}
aside p{margin:0 0 12px;font-size:14px;line-height:1.55;color:var(--soft)}
.dyn{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font:inherit;color:inherit}
.dyn .sw{flex:none;width:26px;height:10px;margin-top:5px;border-radius:5px}
.dyn b{display:block;font-size:14px}.dyn span{font-size:13px;color:var(--soft);line-height:1.45}
.dyn.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:20px;letter-spacing:-.01em}.kpi span{font-size:12px;color:var(--mute)}
.src{font-size:11.5px;color:var(--mute);line-height:1.5;margin-top:14px}
svg text{font-family:var(--ui)}
body.solo{grid-template-rows:minmax(0,1fr)}body.solo header{display:none}
@media (max-width:900px){
 html,body{height:auto}body{display:block;height:auto}
 main{height:auto;padding:6px;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
 #st{height:auto;min-width:880px}
 aside{border-left:0;border-top:1px solid var(--line)}
 .nav{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
 <div><div class="k" id="kick">Corabastos · 1 de 2</div><h1 id="ttl">Cómo funciona hoy la central</h1></div>
 <div class="nav"><button data-s="0" aria-pressed="true">1 · Hoy</button><button data-s="1" aria-pressed="false">2 · Propuesta</button></div>
</header>
<main><svg id="st" viewBox="0 0 1276 808" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Axonometría de Corabastos con las dinámicas"></svg></main>
<aside id="side"></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="corabastos.js"></script>
</body>
</html>
