<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red de actores de Kennedy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e14;
  --ink:#E5E1D8;
  --soft:#A6A197;
  --mute:#726E67;
  --line:#1c202a;
  --faint:#272d3b;
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;font-style:normal}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:1fr 390px;height:100%}
.left{display:grid;grid-template-rows:auto 1fr;min-height:0}
header{padding:18px 26px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);background:#0a0c12}
h1{margin:0;font-size:25px;font-weight:600;letter-spacing:-.025em;line-height:1.05;color:#F0ECE4}
.lede{margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--soft);max-width:62ch}
.nums{display:flex;gap:24px;flex:none}
.nums div{text-align:right}.nums b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1;color:#F0ECE4}
.nums span{font-size:12px;color:var(--mute)}
.stage{position:relative;min-height:0;background:radial-gradient(circle at 1px 1px,#191e2b 1px,transparent 1.3px) 0 0/26px 26px,#0c0e14;overflow:hidden}
#net{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#net:active{cursor:grabbing}
.zoom{position:absolute;right:18px;bottom:18px;display:flex;border:1px solid var(--faint);border-radius:999px;overflow:hidden;background:#10131c;z-index:10;box-shadow:0 6px 16px rgba(0,0,0,0.5)}
.zoom button{background:none;border:0;height:34px;padding:0 14px;cursor:pointer;font-size:13px;color:var(--soft)}
.zoom button+button{border-left:1px solid var(--faint)}
.zoom button:hover{color:var(--ink)}
button:focus-visible{outline:2px solid #828ecc;outline-offset:2px}

.neb{pointer-events:none;transition:opacity .3s}
.orbit{fill:none;stroke-opacity:.2;stroke-width:1;stroke-dasharray:1 5;pointer-events:none}
.crown{fill:none;stroke:#D4AF37;stroke-width:1.6;stroke-opacity:.45;pointer-events:none}
.hlabel{font-weight:600;pointer-events:none;letter-spacing:.02em;paint-order:stroke;stroke:#0c0e14;stroke-width:3px;stroke-linejoin:round;font-size:13px;opacity:.9}

/* Enlaces limpios con visibilidad de dirección */
.link{fill:none;stroke-linecap:round;opacity:.30;transition:opacity .2s, stroke-width .2s}
.node{cursor:pointer}
.node .ring{stroke-opacity:.88;transition:stroke .2s,stroke-width .2s,fill .2s}
.node .icon,.node .logo-img{pointer-events:none}
.node .halo{fill:none;stroke:#fff;stroke-opacity:0;pointer-events:none}
.node.new .ring{stroke-dasharray:4 3}
.node text{fill:#EDE9E1;font-weight:600;pointer-events:none;paint-order:stroke;stroke:#0c0e14;stroke-linejoin:round;stroke-width:3px;font-size:12px}
.node,.hull,.hlabel{transition:opacity .25s}
.focus .node{opacity:.14}.focus .link{opacity:.03}.focus .neb{opacity:.15}
.focus .node.on{opacity:1}.focus .link.on{opacity:.92;stroke-width:2.4px}
.node.sel .halo{stroke-opacity:.5}
.node.sel .ring{stroke:#fff;stroke-opacity:1}
.off{display:none}
.particle{pointer-events:none}

/* Popover interactivo en hover ("pop") sobrio y elegante */
.node-pop{position:absolute;pointer-events:none;z-index:50;display:none;background:rgba(15,18,25,0.96);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(10px);padding:12px 14px;border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,0.65);max-width:280px;transform:translate(-50%,-100%);margin-top:-14px}
.node-pop.visible{display:block;animation:popFade .15s ease-out}
@keyframes popFade{from{opacity:0;transform:translate(-50%,-92%) scale(0.97)}to{opacity:1;transform:translate(-50%,-100%) scale(1)}}
.node-pop .pop-head{display:flex;align-items:center;gap:10px}
.node-pop .pop-av{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.3);display:grid;place-items:center;flex:none;background:#fff;overflow:hidden}
.node-pop .pop-av.dark-av{background:#141722}
.node-pop .pop-title{font-size:13.5px;font-weight:600;color:#F3EFE7;line-height:1.25}
.node-pop .pop-sub{font-size:11.5px;color:var(--soft);margin-top:2px}
.node-pop .pop-meta{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute)}
.node-pop .pop-hint{margin-top:6px;font-size:10.5px;color:var(--soft);opacity:.75;font-style:italic}

.panel{border-left:1px solid var(--line);overflow-y:auto;background:#0d1017}
.sec{padding:22px 24px;border-bottom:1px solid var(--line)}
h2{margin:0 0 4px;font-size:14px;font-weight:600;letter-spacing:-.01em;color:#EDEAE3}
.hint{margin:0 0 14px;font-size:12.5px;line-height:1.4;color:var(--soft)}
.conv{display:flex;flex-direction:column;gap:5px}
.cv{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:7px;background:none;border:1px solid transparent;cursor:pointer;font-size:13px;color:var(--soft);transition:background .15s,color .15s;text-align:left;width:100%}
.cv:hover{background:#151923;color:var(--ink)}
.cv[aria-pressed="false"]{opacity:.35}
.cv .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .n{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.spheres{display:flex;flex-wrap:wrap;gap:6px}
.sp{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#131620;font-size:12px;color:var(--soft);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,color .15s}
.sp:hover{border-color:var(--c);color:var(--ink)}
.sp::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;font-size:12.5px;color:var(--soft)}
.types div{display:flex;align-items:center;gap:8px}
.types .av{width:26px;height:26px;border-radius:50%;background:#161924;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--soft)}
.dash{width:24px;height:0;border-top:1.5px dashed var(--soft);display:inline-block}
.search{position:relative;display:block;margin-bottom:12px}
.search input{width:100%;background:#121622;border:1px solid var(--line);border-radius:8px;padding:9px 12px 9px 34px;font-size:13px;color:var(--ink);outline:0;transition:border-color .15s}
.search input:focus{border-color:#5c6899}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.row{width:100%;display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;background:none;border:0;cursor:pointer;text-align:left;color:inherit;transition:background .15s}
.row:hover{background:#161a25}
.row .av{width:32px;height:32px;border-radius:50%;border:1px solid;display:grid;place-items:center;flex:none;overflow:hidden}
.row .nm{font-size:13px;font-weight:500;display:block;line-height:1.2}
.row .sub{font-size:11.5px;color:var(--mute);display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.row .deg{margin-left:auto;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.back{background:none;border:0;padding:0;color:var(--soft);font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.back:hover{color:var(--ink)}
.who h3{margin:10px 0 2px;font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.2;color:#F3EFE7}
.who .kind{font-size:12px;color:var(--soft)}
.who p{margin:12px 0 16px;font-size:13px;line-height:1.5;color:var(--soft)}
.who .av{border-radius:50%;border:2px solid;display:grid;place-items:center;overflow:hidden}
.io{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-radius:8px;background:#121622;border:1px solid var(--line)}
.io div{text-align:center}.io b{display:block;font-size:20px;font-weight:600;color:#F3EFE7;line-height:1}.io span{font-size:12px;color:var(--mute)}
.group{margin-top:18px}
.group:first-child{margin-top:0}
.ghead{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--soft);margin-bottom:4px}
.it{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer}
.it .dir{font-size:12px;color:var(--mute)}
.it .who2{font-size:14px;font-weight:500;color:var(--ink);margin-top:1px}
.it .ty{font-size:12.5px;color:var(--soft);margin-top:3px}
.it .ds{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.4}
.dots{display:inline-flex;gap:3px;margin-left:8px;vertical-align:1px}
.dots i{width:5px;height:5px;border-radius:50%;background:#313745}.dots i.f{background:var(--c)}
.mob{display:none}
.lvls{display:flex;flex-direction:column;gap:8px}.lvls div{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:center;font-size:13px;line-height:1.4;color:var(--soft)}.lvls b{color:var(--ink);font-weight:600}

.inst-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.inst-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:9px 5px;border:1px solid var(--faint);border-radius:10px;background:#10131d;cursor:pointer;transition:border-color .15s,background .15s}
.inst-card:hover{border-color:#5a6385;background:#171c2a}
.inst-card span{font-size:11px;color:var(--soft);margin-top:5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

@media (max-width:900px){
  .app{display:block;height:auto}
  .left{display:block}
  header{display:block;padding:20px 18px 14px}
  h1{font-size:24px}
  .nums{margin-top:14px;gap:20px}.nums div{text-align:left}
  .stage{height:auto;border-bottom:1px solid var(--line);display:block}
  #net{height:auto}
  .zoom{display:none}
  .panel{border-left:0;overflow:visible}
  .sec{padding:20px 18px}
  .mob{display:block}
}
@media (prefers-reduced-motion:reduce){.particle{display:none}}
</style>
</head>
<body>

<div class="app">
 <div class="left">
  <header>
   <div>
    <h1>Red de actores de Kennedy</h1>
    <p class="lede">La organización social de Kennedy: quién toma las decisiones, quién las coordina, quién las ejecuta y quién las recibe.</p>
   </div>
   <div class="nums"><div><b id="nA"></b><span>actores</span></div><div><b id="nL"></b><span>interacciones</span></div></div>
  </header>
  <div class="stage" id="stage">
   <svg id="net" role="img" aria-label="Red interactiva de relaciones entre actores de Kennedy"></svg>
   <div id="node-pop" class="node-pop"></div>
   <div class="zoom"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button><button id="zfit">Ver red</button></div>
  </div>
 </div>
 <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>

let W,H,MODE;const center={};
function layout(){
  MODE = mobile() ? 'm' : 'd';
  const D = MODE === 'd';
  if(D){
    W = 2200; H = 1550;
    const cx = W / 2, cy = H / 2 + 10;
    center.cor = [cx, cy];
    RING.forEach((k, i) => {
      const a = -Math.PI / 2 + (i + 0.5) * 2 * Math.PI / RING.length;
      center[k] = [cx + Math.cos(a) * 620, cy + Math.sin(a) * 460];
    });
  } else {
    W = 1000; H = 1800;
    const cx = W / 2, cy = H / 2;
    center.cor = [cx, cy];
    RING.forEach((k, i) => {
      const a = -Math.PI / 2 + (i + 0.5) * 2 * Math.PI / RING.length;
      center[k] = [cx + Math.cos(a) * 360, cy + Math.sin(a) * 620];
    });
  }

  let seed = 17; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  nodes.forEach(n => {
    n.r = LVR[MODE][n.lv];
    const c = center[n.sph];
    const a = rnd() * 6.283;
    const d = n.lv === 1 ? 30 : n.lv === 2 ? 100 : n.lv === 3 ? 170 : 220;
    n.x = c[0] + Math.cos(a) * d;
    n.y = c[1] + Math.sin(a) * d;
    n.vx = n.vy = 0;
  });

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).distance(l => l.source.sph === l.target.sph ? (D ? 120 : 95) : (D ? 185 : 145)).strength(l => l.source.sph === l.target.sph ? 0.14 : 0.08))
    .force('charge', d3.forceManyBody().strength(n => (D ? -180 : -120) - n.r * (D ? 8 : 6)).distanceMax(D ? 500 : 350))
    .force('cluster', () => {
      nodes.forEach(n => {
        const c = center[n.sph];
        const k = n.lv === 1 ? 0.05 : n.lv === 2 ? 0.035 : 0.025;
        n.vx += (c[0] - n.x) * k;
        n.vy += (c[1] - n.y) * k;
      });
    })
    .force('collide', d3.forceCollide(n => n.r + (D ? 28 : 20)).iterations(6))
    .stop();

  for (let i = 0; i < 500; i++) sim.tick();
}

function unitPx(){const r = svg.node().getBoundingClientRect(); return Math.min(r.width/W, r.height/H)}
function offs(){const r = svg.node().getBoundingClientRect(), u = unitPx(); return [(r.width - W*u)/2, (r.height - H*u)/2]}

function placeLabels(){
  const u = unitPx() * T.k, fs = mobile() ? 11 : 12, fu = fs / u;
  meas.font = `600 ${fs}px "Instrument Sans", sans-serif`;
  const R = svg.node().getBoundingClientRect(), boxes = [], out = b => b[0]<4||b[1]<4||b[2]>R.width-4||b[3]>R.height-4, ov = (a,o)=>a[0]<o[2]&&a[2]>o[0]&&a[1]<o[3]&&a[3]>o[1], nb = [], hit = (b,soft)=>out(b)||boxes.some(o=>ov(b,o))||(!soft&&nb.some(o=>ov(b,o)));
  const O = offs(), sx = n => (n.x*T.k + T.x)*unitPx() + O[0], sy = n => (n.y*T.k + T.y)*unitPx() + O[1];
  const vis = nodes.filter(n => !n.hidden);
  vis.filter(n => !state.sel || n === state.sel || state.sel.nb.has(n.id)).forEach(n => {
    const r = n.r * u, x = sx(n), y = sy(n);
    nb.push([x-r, y-r, x+r, y+r]);
  });

  // Títulos de ámbito
  const hs = mobile() ? 12 : 14, hu = hs / u;
  meas.font = `600 ${hs}px "Instrument Sans", sans-serif`;
  gT.selectAll('text').attr('font-size', hu).each(function(d){
    const w = meas.measureText(SPH[d.k]).width, x = (d.cx*T.k + T.x)*unitPx() + O[0];
    let ok = false;
    if(!state.sel && !state.hov){
      const ly = d.top - 10, y = (ly*T.k + T.y)*unitPx() + O[1];
      boxes.push([x - w/2 - 6, y - hs, x + w/2 + 6, y + 6]);
      d3.select(this).attr('y', ly);
      ok = true;
    }
    d3.select(this).style('display', ok ? null : 'none');
  });

  meas.font = `500 ${fs}px "Instrument Sans", sans-serif`;
  const sel = state.sel, prio = n => (sel && (n === sel ? 5 : sel.nb.has(n.id) ? 3 : 0)) + (n === state.hov ? 5 : (state.hov && state.hov.nb.has(n.id) ? 3 : 0)) + (REAL_LOGOS[n.id] ? 2 : 0) + (n.lv <= 2 ? 1 : 0);
  const order = [...vis].sort((a,b) => prio(b) - prio(a) || b.deg - a.deg);
  const shown = new Map();

  order.forEach(n => {
    const isPrio = n === sel || n === state.hov || (sel && sel.nb.has(n.id)) || (state.hov && state.hov.nb.has(n.id));
    const base = !sel && !state.hov && (n.lv <= 1 || (REAL_LOGOS[n.id] && T.k > 1.05) || T.k > 1.5);
    if (!isPrio && !base) return;

    const w = meas.measureText(n.short).width, r = n.r * u, x = sx(n), y = sy(n), g = 7;
    const cand = [

   <p class="hint">Instituciones con logo oficial verificado (incluido Acueducto de Bogotá). Toca una para ubicarla en la red:</p>
   <div class="inst-preview">
    ${featuredInst.map(inst=>`<div class="inst-card" data-id="${inst.id}">
      <span class="av" style="border-color:${SPC[inst.sph]};width:40px;height:40px;background:#fff;border-radius:50%;display:grid;place-items:center">${avatar(inst, 34)}</span>
      <span>${esc(inst.short)}</span>
    </div>`).join('')}
   </div>
  </section>

  <section class="sec"><h2>Convenciones de interacción</h2>
   <p class="hint">Color y trazo definen el tipo de relación; el grosor, la intensidad. Toca para filtrar.</p>
   <div class="conv">${Object.entries(CONV).map(([k,v])=>`<button class="cv" data-c="${k}" aria-pressed="${state.conv.has(k)}">${sample(k)}<span class="t">${v.n}</span><span class="n">${counts.get(k)||0}</span></button>`).join('')}</div>
   <div class="conv" style="margin-top:12px;font-size:12.5px;color:var(--mute);gap:8px">
    <div style="display:flex;align-items:center;gap:12px"><svg width="46" height="12"><path d="M2 6H44" stroke="#827D76" stroke-width="1.1"/></svg>Débil</div>
    <div style="display:flex;align-items:center;gap:12px"><svg width="46" height="12"><path d="M2 6H44" stroke="#827D76" stroke-width="3"/></svg>Fuerte</div>
   </div>
  </section>

  <section class="sec"><h2>Tipos de actor</h2><p class="hint">Íconos estándar reconocibles según rol y sector:</p>
   <div class="types">
    <div><span class="av"><svg width="15" height="15"><use href="#i-per"/></svg></span>Persona / Rol</div>
    <div><span class="av"><svg width="15" height="15"><use href="#i-hog"/></svg></span>Hogar / Familia</div>
    <div><span class="av"><svg width="15" height="15"><use href="#i-org"/></svg></span>Organización / Junta</div>
    <div><span class="av"><svg width="15" height="15"><use href="#i-emp"/></svg></span>Comercio / Empresa</div>
    <div><span class="av"><svg width="15" height="15"><use href="#i-pub"/></svg></span>Entidad pública</div>
    <div><span class="av"><svg width="15" height="15"><use href="#i-sal"/></svg></span>Salud / Hospital</div>
    <div><span class="av"><svg width="15" height="15"><use href="#i-edu"/></svg></span>Educación / Colegio</div>
    <div><span class="dash"></span>Añadido a tu Excel</div>
   </div>
  </section>

  <section class="sec"><h2>Clústeres</h2><p class="hint">Ámbitos de interacción en Kennedy:</p>
   <div class="spheres">${Object.entries(SPH).map(([k,v])=>`<button class="sp" data-s="${k}" style="--c:${SPC[k]}">${v}</button>`).join('')}</div>
  </section>

  <section class="sec"><h2>Actores</h2>
   <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#726E67" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar actor o institución" value="${esc(state.q)}" aria-label="Buscar actor"></label>
   <ul class="list" id="al"></ul>
  </section>`;
}

function actorList(){
  const q = state.q.trim().toLowerCase();
  document.getElementById('al').innerHTML = nodes.filter(n => !q || (n.name + ' ' + n.short).toLowerCase().includes(q)).sort((a,b) => b.deg - a.deg)
   .map(n => {
     const hasLogo = !!REAL_LOGOS[n.id];
     return `<li><button class="row" data-id="${n.id}">
       <span class="av" style="border-color:${hasLogo?SPC[n.sph]:'#2e3547'};background:${hasLogo?'#fff':'#141722'}">${avatar(n, 30)}</span>
       <span><span class="nm">${esc(n.short)}</span><span class="sub">${esc(n.name!==n.short?n.name:TYPES[n.cat]||'Actor')}</span></span>
       <span class="deg">${n.deg}</span>
     </button></li>`;
   }).join('');
}

function detail(n){
  const rows = [...n.out.map(l => ({l, o: l.target, d: 'Hacia'})), ...n.in.map(l => ({l, o: l.source, d: 'Desde'}))];
  const groups = Object.keys(CONV).map(k => [k, rows.filter(r => r.l.c === k)]).filter(g => g[1].length);
  const hasLogo = !!REAL_LOGOS[n.id];
  return `
  <section class="sec"><button class="back" id="back">← Volver a toda la red</button>
   <div class="who">
    <div style="display:flex;align-items:center;gap:14px;margin-top:16px">
     <span class="av" style="width:52px;height:52px;border-color:${SPC[n.sph]};border-width:2px;flex:none;background:${hasLogo?'#fff':'#141722'}">${avatar(n, 46)}</span>
     <div>
      <h3>${esc(n.name)}</h3>
      <div class="kind">${esc(n.nat)}</div>
     </div>
    </div>
    <div class="kind" style="margin-top:10px"><b>Clúster:</b> ${esc(SPH[n.sph])}</div>
    <div class="kind" style="margin-top:2px"><b>Nivel:</b> ${LV[n.lv]}</div>
    <p>${esc(n.fun)}</p>
    <div class="io"><div><b>${n.out.length}</b><span>relaciones que inicia</span></div><div><b>${n.in.length}</b><span>relaciones que recibe</span></div></div>
   </div>
  </section>
  <section class="sec">
   <h2>Relaciones con otros actores</h2>
   ${groups.map(([k,rs])=>`<div class="group"><div class="ghead">${sample(k,34)}${CONV[k].n}</div>
    ${rs.map(({l,o,d})=>{
      const oLogo = !!REAL_LOGOS[o.id];
      return `<button class="it" data-id="${o.id}">
        <div style="display:flex;align-items:center;gap:10px">
         <span class="av" style="width:30px;height:30px;border-color:${oLogo?SPC[o.sph]:'#2e3547'};flex:none;background:${oLogo?'#fff':'#141722'}">${avatar(o, 26)}</span>
         <div style="flex:1;min-width:0">
          <div class="dir">${d}</div>
          <div class="who2">${esc(o.name)}</div>
         </div>
        </div>
        <div class="ty" style="margin-left:40px">${esc(l.type)}${dots(l.w,CONV[k].c)}</div>
        <div class="ds" style="margin-left:40px">${esc(l.desc)}</div>
      </button>`;
    }).join('')}</div>`).join('')}
  </section>`;
}

function renderPanel(){
  if(state.sel){
    P.innerHTML = detail(state.sel);
    document.getElementById('back').onclick = () => { select(null, 'keep'); fitAll(); };
    P.scrollTop = 0;
  } else {
    P.innerHTML = overview();
    actorList();
    const q = document.getElementById('q');
    q.oninput = () => { state.q = q.value; actorList(); };
    P.querySelectorAll('.cv').forEach(b => b.onclick = () => {
      const k = b.dataset.c;
      state.conv.has(k) ? state.conv.delete(k) : state.conv.add(k);
      b.setAttribute('aria-pressed', state.conv.has(k));
      applyConv();
    });
    P.querySelectorAll('.sp').forEach(b => b.onclick = () => {
      const ns = nodes.filter(n => n.sph === b.dataset.s);
      if (MODE === 'd') fitTo(ns, 700, 2.0);
      else scrollToNode(ns[0]);
    });
    P.querySelectorAll('.inst-card').forEach(b => b.onclick = () => select(byId.get(b.dataset.id), 'list'));
  }
  P.querySelectorAll('[data-id]').forEach(b => b.onclick = () => select(byId.get(b.dataset.id), 'list'));
}

/* ---------- inicio ---------- */
renderPanel();
const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!reduce){
  gH.attr('opacity', 0).transition().duration(1000).attr('opacity', 1);
  nodeSel.attr('opacity', 0).transition().delay(n => 100 + Math.hypot(n.x - W/2, n.y - H/2) * .6).duration(450).attr('opacity', 1);
  linkSel.style('opacity', 0).transition().delay(600).duration(800).style('opacity', null);
}
requestAnimationFrame(() => { sizeMobile(); fitAll(0); document.fonts && document.fonts.ready.then(queue); });

let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if ((mobile() ? 'm' : 'd') !== MODE){ layout(); geometry(); if(state.sel) focus(state.sel); }
    sizeMobile(); fitAll(0);
  }, 180);
});
window.__net = {nodes, links};
</script>
</body>
</html>
