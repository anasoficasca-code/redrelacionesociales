<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red de actores de Kennedy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#EEEAE3;--soft:#B9B4AB;--mute:#7E7A73;--line:#1A1918;--faint:#2E2C29;
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box;font-style:normal}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:1fr 390px;height:100%}
.left{display:grid;grid-template-rows:auto 1fr;min-height:0}
header{padding:20px 28px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:27px;font-weight:600;letter-spacing:-.025em;line-height:1.05}
.lede{margin:6px 0 0;font-size:13.5px;line-height:1.45;color:var(--soft);max-width:62ch}
.nums{display:flex;gap:24px;flex:none}
.nums div{text-align:right}.nums b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1}
.nums span{font-size:12px;color:var(--mute)}
.stage{position:relative;min-height:0;background:radial-gradient(circle at 1px 1px,#171615 1px,transparent 1.3px) 0 0/24px 24px,#000;overflow:hidden}
#net{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#net:active{cursor:grabbing}
.zoom{position:absolute;right:18px;bottom:18px;display:flex;border:1px solid var(--faint);border-radius:999px;overflow:hidden;background:#000;z-index:10}
.zoom button{background:none;border:0;height:34px;padding:0 14px;cursor:pointer;font-size:13px;color:var(--soft)}
.zoom button+button{border-left:1px solid var(--faint)}
.zoom button:hover{color:var(--ink)}
button:focus-visible{outline:2px solid #9AA4FF;outline-offset:2px}

.neb{pointer-events:none;transition:opacity .3s}
.orbit{fill:none;stroke-opacity:.28;stroke-width:1;stroke-dasharray:1 5;pointer-events:none}
.crown{fill:none;stroke-width:1.5;stroke-opacity:.8;stroke-dasharray:3 3}
.glow{pointer-events:none}
.hlabel{font-weight:600;pointer-events:none;letter-spacing:.02em;paint-order:stroke;stroke:#000;stroke-width:4px;stroke-linejoin:round;font-size:14px}
.link{fill:none;stroke-linecap:round;opacity:.38;mix-blend-mode:screen;transition:opacity .25s}
.node{cursor:pointer}
.node .ring{stroke-opacity:.95;transition:stroke .2s,stroke-width .2s,fill .2s}
.node .icon,.node .logo-mark{pointer-events:none}
.node .halo{fill:none;stroke:#fff;stroke-opacity:0}
.node.new .ring{stroke-dasharray:4 3}
.node text{fill:#EEEAE3;font-weight:600;pointer-events:none;paint-order:stroke;stroke:#000;stroke-linejoin:round;stroke-width:3px;font-size:12px}
.node,.hull,.hlabel{transition:opacity .25s}
.focus .node{opacity:.12}.focus .link{opacity:.03}.focus .neb{opacity:.2}
.focus .node.on{opacity:1}.focus .link.on{opacity:1}
.node.sel .halo{stroke-opacity:.6}
.node.sel .ring{stroke:#fff;stroke-opacity:1}
.off{display:none}
.particle{pointer-events:none}

/* Popup flotante interactivo */
.node-pop{position:absolute;pointer-events:none;z-index:50;display:none;background:rgba(12,14,18,0.96);border:1.2px solid rgba(255,255,255,0.18);backdrop-filter:blur(10px);padding:12px 14px;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,0.85);max-width:280px;transform:translate(-50%,-100%);margin-top:-14px}
.node-pop.visible{display:block;animation:popFade .18s ease-out}
@keyframes popFade{from{opacity:0;transform:translate(-50%,-90%) scale(0.96)}to{opacity:1;transform:translate(-50%,-100%) scale(1)}}
.node-pop .pop-head{display:flex;align-items:center;gap:10px}
.node-pop .pop-av{width:36px;height:36px;border-radius:50%;border:1.5px solid #fff;display:grid;place-items:center;flex:none;background:#05070a}
.node-pop .pop-title{font-size:14px;font-weight:600;color:#fff;line-height:1.25}
.node-pop .pop-sub{font-size:11.5px;color:var(--soft);margin-top:2px}
.node-pop .pop-meta{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute)}
.node-pop .pop-hint{margin-top:6px;font-size:10.5px;color:var(--mute);font-style:italic}

.panel{border-left:1px solid var(--line);overflow-y:auto;background:#030303}
.sec{padding:22px 24px;border-bottom:1px solid var(--line)}
.sec h2{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sec .hint{margin:0 0 14px;font-size:12.5px;color:var(--mute);line-height:1.45}
.conv{display:flex;flex-direction:column;gap:2px}
.cv{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:12px;padding:8px 6px;border:0;background:none;text-align:left;border-radius:8px;cursor:pointer}
.cv:hover{background:#0f0e0d}
.cv[aria-pressed=false]{opacity:.32}
.cv .t{{font-size:13.5px;color:var(--ink);line-height:1.3}
.cv .n{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:13px;color:var(--soft)}
.types div{display:flex;align-items:center;gap:9px}
.types .dash{width:22px;height:22px;border-radius:50%;border:1.3px dashed #E9E5DD;flex:none}
.spheres{display:flex;flex-wrap:wrap;gap:6px}
.sp{border:1px solid var(--faint);background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--soft);cursor:pointer}
.sp::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:0}
.sp:hover{color:var(--ink);border-color:#4a4743}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--faint);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:14px}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.row:hover .nm{color:#fff}
.av{width:38px;height:38px;border-radius:50%;border:1.5px solid #6d6963;display:grid;place-items:center;color:#E9E5DD;overflow:hidden;background:#0a0b0e}
.nm{display:block;font-size:14px;font-weight:500;line-height:1.25}
.sub{display:block;font-size:12px;color:var(--mute);line-height:1.35;margin-top:2px}
.deg{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.back{background:none;border:1px solid var(--faint);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer}
.back:hover{border-color:#6d6963;color:#fff}
.who h3{margin:0;font-size:21px;font-weight:600;line-height:1.2;letter-spacing:-.015em}
.who .kind{font-size:13px;color:var(--mute);margin-top:3px}
.who p{font-size:14px;line-height:1.5;color:var(--soft);margin:14px 0 0}
.io{display:flex;gap:22px;margin-top:16px}
.io b{font-size:22px;font-weight:600;display:block;line-height:1}.io span{font-size:12px;color:var(--mute)}
.group{margin-top:18px}
.group:first-child{margin-top:0}
.ghead{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--soft);margin-bottom:4px}
.it{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer}
.it .dir{font-size:12px;color:var(--mute)}
.it .who2{font-size:14px;font-weight:500;color:var(--ink);margin-top:1px}
.it .ty{font-size:12.5px;color:var(--soft);margin-top:3px}
.it .ds{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.4}
.dots{display:inline-flex;gap:3px;margin-left:8px;vertical-align:1px}
.dots i{width:5px;height:5px;border-radius:50%;background:#3a3835}.dots i.f{background:var(--c)}
.mob{display:none}
.lvls{display:flex;flex-direction:column;gap:8px}.lvls div{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:center;font-size:13px;line-height:1.4;color:var(--soft)}.lvls b{color:var(--ink);font-weight:600}

.inst-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:10px}
.inst-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:9px 4px;border:1px solid var(--faint);border-radius:10px;background:#08090c;cursor:pointer}
.inst-card:hover{border-color:#6d6963;background:#101217}
.inst-card span{font-size:11px;color:var(--soft);margin-top:5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

@media (max-width:900px){
  .app{display:block;height:auto}
  .left{display:block}
  header{display:block;padding:20px 18px 14px}
  h1{font-size:25px}
  .nums{margin-top:14px;gap:20px}.nums div{text-align:left}
  .stage{height:auto;border-bottom:1px solid var(--line);display:block}
  #net{height:auto}
  .zoom{display:none}
  .panel{border-left:0;overflow:visible}
  .sec{padding:20px 18px}
  .mob{display:block}
}
@media (prefers-reduced-motion:reduce){.particle{display:none}}
</style>
</head>

let W,H,MODE;const center={};
function layout(){
  MODE = mobile() ? 'm' : 'd';
  const D = MODE === 'd';
  if(D){
    W = 1920; H = 1380;
    const cx = W / 2, cy = H / 2 + 10;
    center.cor = [cx, cy];
    RING.forEach((k, i) => {
      const a = -Math.PI / 2 + (i + 0.5) * 2 * Math.PI / RING.length;
      center[k] = [cx + Math.cos(a) * 480, cy + Math.sin(a) * 380];
    });
  } else {
    W = 1000; H = 1650;
    const cx = W / 2, cy = H / 2;
    center.cor = [cx, cy];
    RING.forEach((k, i) => {
      const a = -Math.PI / 2 + (i + 0.5) * 2 * Math.PI / RING.length;
      center[k] = [cx + Math.cos(a) * 360, cy + Math.sin(a) * 580];
    });
  }

  let seed = 17; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  nodes.forEach(n => {
    n.r = LVR[MODE][n.lv];
    const c = center[n.sph];
    const a = rnd() * 6.283;
    const d = n.lv === 1 ? 24 : n.lv === 2 ? 75 : n.lv === 3 ? 125 : 165;
    n.x = c[0] + Math.cos(a) * d;
    n.y = c[1] + Math.sin(a) * d;
    n.vx = n.vy = 0;
  });

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).distance(l => l.source.sph === l.target.sph ? (D ? 80 : 70) : (D ? 140 : 120)).strength(l => l.source.sph === l.target.sph ? 0.16 : 0.09))
    .force('charge', d3.forceManyBody().strength(n => (D ? -120 : -90) - n.r * (D ? 5.5 : 4.5)).distanceMax(D ? 380 : 280))
    .force('cluster', () => {
      nodes.forEach(n => {
        const c = center[n.sph];
        const k = n.lv === 1 ? 0.06 : n.lv === 2 ? 0.045 : 0.035;
        n.vx += (c[0] - n.x) * k;
        n.vy += (c[1] - n.y) * k;
      });
    })
    .force('collide', d3.forceCollide(n => n.r + (D ? 14 : 10)).iterations(5))
    .stop();

  for (let i = 0; i < 450; i++) sim.tick();
}
layout();

function path(l){
  const s = l.source, t = l.target, dx = t.x - s.x, dy = t.y - s.y, d = Math.hypot(dx,dy) || 1;
  const back = links.some(o => o.s === l.t && o.t === l.s);
  const k = back ? .22 : .14, mx = (s.x + t.x) / 2 - dy * k, my = (s.y + t.y) / 2 + dx * k;
  const ex = t.x - mx, ey = t.y - my, ed = Math.hypot(ex,ey) || 1, sx0 = mx - s.x, sy0 = my - s.y, sd = Math.hypot(sx0,sy0) || 1;
  const pad = 4;
  return `M${s.x + sx0 / sd * (s.r + 2)},${s.y + sy0 / sd * (s.r + 2)}Q${mx},${my} ${t.x - ex / ed * (t.r + pad)},${t.y - ey / ed * (t.r + pad)}`;
}

  nodeSel.attr('transform',n=>`translate(${n.x},${n.y})`);
  nodeSel.select('.glow').attr('r',n=>n.r*(n.lv===1?1.28:1.1)).attr('fill',n=>SPC[n.sph]).attr('opacity',n=>n.lv===1?.65:n.lv===2?.42:.22);
  nodeSel.select('.crown').attr('r',n=>n.r+(MODE==='d'?9:8)).attr('stroke',n=>SPC[n.sph]);
  nodeSel.select('.ring').attr('r',n=>n.r)
    .attr('stroke-width',n=>LOGOS.has(n.id)?(n.lv===1?3.2:2.4):(n.lv===1?2.8:n.lv===2?2.0:1.4))
    .attr('stroke',n=>SPC[n.sph])
    .attr('fill',n=>LOGOS.has(n.id)?'#08090C':(n.lv===4?SPC[n.sph]:d3.interpolateRgb('#000',SPC[n.sph])(n.lv===1?.32:.16)));
  nodeSel.select('.halo').attr('r',n=>n.r+9).attr('stroke-width',MODE==='d'?8:9);

  /* Iconos / logos ampliados dentro de la bolita para visualización limpia */
  nodeSel.select('.logo-mark')
    .attr('width',n=>n.r*1.52).attr('height',n=>n.r*1.52)
    .attr('x',n=>-n.r*.76).attr('y',n=>-n.r*.76);

  nodeSel.select('.icon')
    .style('color',n=>n.lv===4?'#0b0b0b':n.lv===1?'#fff':SPC[n.sph])
    .attr('width',n=>n.r*1.28).attr('height',n=>n.r*1.28)
    .attr('x',n=>-n.r*.64).attr('y',n=>-n.r*.64);

  // Nebulosas suaves de los clústeres
  const cls = Object.keys(SPH).map(k => {
    const cNodes = nodes.filter(n => n.sph === k);
    const avgX = d3.mean(cNodes, n => n.x) || center[k][0];
    const avgY = d3.mean(cNodes, n => n.y) || center[k][1];
    const R = (d3.max(cNodes, n => Math.hypot(n.x - avgX, n.y - avgY) + n.r) || 120) + 38;
    return {k, cx: avgX, cy: avgY, R, top: avgY - R + 6};
  });
  gH.selectAll('*').remove();
  cls.forEach(c => {
    gH.append('circle').attr('class','neb').attr('cx',c.cx).attr('cy',c.cy).attr('r',c.R+20).attr('fill',`url(#g-${c.k})`);
  });
  gT.selectAll('text').data(cls).join('text').attr('class','hlabel').attr('fill',d=>SPC[d.k]).attr('text-anchor','middle').text(d=>SPH[d.k])
    .each(function(d){d.ly = d.top - 8; d3.select(this).attr('x',d.cx).attr('y',d.ly)});
}
geometry();

/* ---------- etiquetas legibles ---------- */
const meas = document.createElement('canvas').getContext('2d');
let T = d3.zoomIdentity;
function unitPx(){const r = svg.node().getBoundingClientRect(); return Math.min(r.width/W, r.height/H)}
function offs(){const r = svg.node().getBoundingClientRect(), u = unitPx(); return [(r.width - W*u)/2, (r.height - H*u)/2]}

function placeLabels(){
  const u = unitPx() * T.k, fs = mobile() ? 11 : 12, fu = fs / u;
  meas.font = `600 ${fs}px "Instrument Sans", sans-serif`;
  const R = svg.node().getBoundingClientRect(), boxes = [], out = b => b[0]<4||b[1]<4||b[2]>R.width-4||b[3]>R.height-4, ov = (a,o)=>a[0]<o[2]&&a[2]>o[0]&&a[1]<o[3]&&a[3]>o[1], nb = [], hit = (b,soft)=>out(b)||boxes.some(o=>ov(b,o))||(!soft&&nb.some(o=>ov(b,o)));
  const O = offs(), sx = n => (n.x*T.k + T.x)*unitPx() + O[0], sy = n => (n.y*T.k + T.y)*unitPx() + O[1];
  const vis = nodes.filter(n => !n.hidden);
  vis.filter(n => !state.sel || n === state.sel || state.sel.nb.has(n.id)).forEach(n => {
    const r = n.r * u, x = sx(n), y = sy(n);
    nb.push([x-r, y-r, x+r, y+r]);
  });

  // Títulos de ámbito
  const hs = mobile() ? 12 : 14, hu = hs / u;
  meas.font = `600 ${hs}px "Instrument Sans", sans-serif`;
  gT.selectAll('text').attr('font-size', hu).each(function(d){
    const w = meas.measureText(SPH[d.k]).width, x = (d.cx*T.k + T.x)*unitPx() + O[0];
    let ok = false;
    if(!state.sel && !state.hov){
      const ly = d.top - 8, y = (ly*T.k + T.y)*unitPx() + O[1];
      boxes.push([x - w/2 - 6, y - hs, x + w/2 + 6, y + 6]);
      d3.select(this).attr('y', ly);
      ok = true;
    }
    d3.select(this).style('display', ok ? null : 'none');
  });

  meas.font = `500 ${fs}px "Instrument Sans", sans-serif`;
  const sel = state.sel, prio = n => (sel && (n === sel ? 5 : sel.nb.has(n.id) ? 3 : 0)) + (n === state.hov ? 5 : (state.hov && state.hov.nb.has(n.id) ? 3 : 0)) + (LOGOS.has(n.id) ? 2 : 0) + (n.lv <= 2 ? 1 : 0);
  const order = [...vis].sort((a,b) => prio(b) - prio(a) || b.deg - a.deg);
  const shown = new Map();

  order.forEach(n => {
    const isPrio = n === sel || n === state.hov || (sel && sel.nb.has(n.id)) || (state.hov && state.hov.nb.has(n.id));
    const base = !sel && !state.hov && (n.lv <= 1 || (LOGOS.has(n.id) && T.k > 1.1) || T.k > 1.6);
    if (!isPrio && !base) return;

    const w = meas.measureText(n.short).width, r = n.r * u, x = sx(n), y = sy(n), g = 6;
    const cand = [
      [x + r + g, y - fs/2 - 1, 'start', r + g, fs*.36],
      [x - r - g - w, y - fs/2 - 1, 'end', -(r + g), fs*.36],
      [x - w/2, y + r + g, 'middle', 0, r + g + fs*.85],
      [x - w/2, y - r - g - fs, 'middle', 0, -(r + g) - fs*.25]
    ];
    const soft = isPrio;
    for(const [bx,by,anc,dx,dy] of cand){
      const b = [bx - 3, by - 2, bx + w + 3, by + fs + 2];
      if(!hit(b, soft)){
        boxes.push(b);
        shown.set(n, [anc, dx/u, dy/u]);
        break;
      }
    }
  });

  nodeSel.select('text').each(function(n){
    const s = shown.get(n), t = d3.select(this);
    if(!s){ t.style('display','none'); return; }
    t.style('display', null).attr('text-anchor', s[0]).attr('x', s[1]).attr('y', s[2]).attr('font-size', fu)
     .attr('stroke-width', 3.5/u).attr('font-weight', (n === sel || n === state.hov || LOGOS.has(n.id)) ? 600 : 500).text(n.short);
  });
}
let raf; const queue = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(placeLabels); };

/* ---------- zoom ---------- */
const zoom = d3.zoom().scaleExtent([.5, 5]).on('zoom', e => { T = e.transform; root.attr('transform', T); queue(); });
svg.call(zoom).on('dblclick.zoom', null);

function fitTo(ns, dur = 700, maxK = 2.6){
  const pad = MODE === 'd' ? 60 : 30, px = MODE === 'd' ? 80 : 40;
  const x0 = d3.min(ns, n => n.x - n.r) - px, x1 = d3.max(ns, n => n.x + n.r) + px,
        y0 = d3.min(ns, n => n.y - n.r) - pad - 24, y1 = d3.max(ns, n => n.y + n.r) + pad + 24;
  const k = Math.min(maxK, W / (x1 - x0), H / (y1 - y0));
  svg.transition().duration(dur).call(zoom.transform, d3.zoomIdentity.translate(W/2 - k*(x0 + x1)/2, H/2 - k*(y0 + y1)/2).scale(k));
}
const fitAll = (d = 700) => { if (MODE === 'm') return; fitTo(nodes, d, 1.15); };
function sizeMobile(){
  if (MODE === 'm'){
    const w = svg.node().parentNode.getBoundingClientRect().width;
    svg.style('height', (w * H / W) + 'px');
    svg.on('.zoom', null);
    T = d3.zoomIdentity;
    root.attr('transform', null);
  } else {
    svg.style('height', null);
    svg.call(zoom).on('dblclick.zoom', null);
  }
  queue();
}
function scrollToNode(n){
  const r = svg.node().getBoundingClientRect();
  window.scrollTo({top: window.scrollY + r.top + n.y * unitPx() - window.innerHeight * .4, behavior: 'smooth'});
}
document.getElementById('zin').onclick = () => svg.transition().call(zoom.scaleBy, 1.35);
document.getElementById('zout').onclick = () => svg.transition().call(zoom.scaleBy, 1/1.35);
document.getElementById('zfit').onclick = () => { select(null); fitAll(); };

/* ---------- popover flotante en hover ("pop") ---------- */
const pop = document.getElementById('node-pop');
const stage = document.getElementById('stage');

function showPop(n, e){
  const O = offs(), u = unitPx();
  const screenX = (n.x * T.k + T.x) * u + O[0];
  const screenY = (n.y * T.k + T.y) * u + O[1] - (n.r * u * T.k) - 8;

  pop.innerHTML = `
    <div class="pop-head">
      <div class="pop-av" style="border-color:${SPC[n.sph]}">${avatar(n, 28)}</div>
      <div>
        <div class="pop-title">${esc(n.name)}</div>
        <div class="pop-sub">${esc(n.nat)}</div>
      </div>
    </div>
    <div class="pop-meta">
      <span><b style="color:${SPC[n.sph]}">${esc(SPH[n.sph].split(' ')[0])}</b> · ${esc(LV[n.lv])}</span>
      <span>${n.deg} vínculos</span>
    </div>
    <div class="pop-hint">Toca para ver sus relaciones completas</div>
  `;
  pop.style.left = screenX + 'px';
  pop.style.top = screenY + 'px';
  pop.classList.add('visible');
}
function hidePop(){
  pop.classList.remove('visible');
}

/* ---------- estado, filtros, selección ---------- */
const state = {sel:null, hov:null, conv:new Set(Object.keys(CONV)), q:''};

function applyConv(){
  linkSel.classed('off', l => !state.conv.has(l.c));
  nodes.forEach(n => n.hidden = false);
  if(state.sel) focus(state.sel);
  queue();
}

function focus(n){
  svg.classed('focus', !!n);
  nodeSel.classed('on', d => n && (d === n || n.nb.has(d.id))).classed('sel', d => d === n);
  linkSel.classed('on', l => n && (l.source === n || l.target === n));
  gP.selectAll('*').remove();
  if(n && !window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    [...n.out, ...n.in].filter(l => state.conv.has(l.c)).forEach((l, j) => {
      for(let q = 0; q < 2; q++){
        const c = gP.append('circle').attr('class','particle').attr('r', MODE === 'd' ? 3.0 : 3.5).attr('fill', CONV[l.c].c);
        c.append('animateMotion').attr('dur', (2.2 + (j % 3) * .3) + 's').attr('repeatCount', 'indefinite').attr('begin', (q * 1.1 + j * .07) + 's')
         .append('mpath').attr('href', '#p' + l.i);
      }
    });
  }
}

function select(n, how){
  state.sel = n;
  focus(n);
  renderPanel();
  queue();
  if (n) hidePop();
  if (n && how !== 'keep' && MODE === 'd'){
    fitTo([n, ...[...n.nb].map(i => byId.get(i))], 650, 2.0);
  }
  if (n && MODE === 'm' && how === 'list') scrollToNode(n);
}

nodeSel.on('mouseenter', (e, n) => {
  state.hov = n;
  if (!state.sel){ focus(n); }
  showPop(n, e);
  queue();
})
.on('mouseleave', () => {
  state.hov = null;
  if (!state.sel) focus(null);
  hidePop();
  queue();
})
.on('click', (e, n) => {
  e.stopPropagation();
  select(n, 'node');
})
.on('keydown', (e, n) => {
  if (e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    select(n, 'node');
  }
});

svg.on('click', () => {
  if (state.sel){ select(null, 'keep'); }
  hidePop();
});

/* ---------- panel y avatares ---------- */
const P = document.getElementById('panel');

const avatar = (n, s = 24) => {
  if (LOGOS.has(n.id)) {
    return `<svg width="${s}" height="${s}" viewBox="0 0 100 100" style="border-radius:50%;display:block"><use href="#logo-${n.id}"/></svg>`;
  }
  return `<svg width="${s - 6}" height="${s - 6}"><use href="#i-${n.cat}"/></svg>`;
};
const sample = (k, w = 46) => `<svg width="${w}" height="12" aria-hidden="true"><path d="M2 6H${w-9}" stroke="${CONV[k].c}" stroke-width="2.4" stroke-linecap="round" ${CONV[k].d?`stroke-dasharray="${CONV[k].d}"`:''}/><path d="M${w-10} 2.2 ${w-2} 6 ${w-10} 9.8z" fill="${CONV[k].c}"/></svg>`;
const dots = (w, c) => `<span class="dots" style="--c:${c}" title="Intensidad ${w} de 3">${[1,2,3].map(i=>`<i class="${i<=w?'f':''}"></i>`).join('')}</span>`;

function overview(){
  const counts = d3.rollup(links, v => v.length, l => l.c);
  const featuredInst = [
    byId.get('A01'), byId.get('A34'), byId.get('A38'), byId.get('A48'),
    byId.get('A49'), byId.get('A32'), byId.get('N06'), byId.get('A65'),
    byId.get('N08'), byId.get('C01'), byId.get('N07'), byId.get('A28')
  ].filter(Boolean);

  return `
  <section class="sec"><h2>Quién decide y quién ejecuta</h2>
   <p class="hint">Red social interconectada: en cada ámbito, los decisores al centro con mayor tamaño; en su órbita, quienes coordinan, ejecutan y reciben en Kennedy.</p>
   <div class="lvls">${[1,2,3,4].map(l=>{const r=LVR.d[l];return `<div><svg width="74" height="74" viewBox="0 0 74 74"><circle cx="37" cy="37" r="${r*.75}" fill="#E9E5DD" opacity="${l===1?.35:l===2?.2:.1}" filter="url(#glow)"/>${l===1?`<circle cx="37" cy="37" r="${r*.75+6}" fill="none" stroke="#E9E5DD" stroke-dasharray="2 3" stroke-opacity=".7"/>`:''}<circle cx="37" cy="37" r="${r*.75}" fill="${l===4?'#E9E5DD':'#1a1917'}" stroke="#E9E5DD" stroke-width="${l===1?2.4:l===2?1.8:1.3}"/></svg><span><b>${LV[l]}</b><br>${LVD[l]}</span></div>`}).join('')}</div>
  </section>

  <section class="sec"><h2>Instituciones destacadas</h2>
   <p class="hint">Toca cualquier institución para ubicarla en la red:</p>
   <div class="inst-preview">
    ${featuredInst.map(inst=>`<div class="inst-card" data-id="${inst.id}">
      <span class="av" style="border-color:${SPC[inst.sph]};width:40px;height:40px">${avatar(inst, 36)}</span>
      <span>${esc(inst.short)}</span>
    </div>`).join('')}
   </div>
  </section>

  <section class="sec"><h2>Convenciones de interacción</h2>
   <p class="hint">Color y trazo definen el tipo de relación; el grosor, la intensidad. Toca para filtrar.</p>
   <div class="conv">${Object.entries(CONV).map(([k,v])=>`<button class="cv" data-c="${k}" aria-pressed="${state.conv.has(k)}">${sample(k)}<span class="t">${v.n}</span><span class="n">${counts.get(k)||0}</span></button>`).join('')}</div>
   <div class="conv" style="margin-top:12px;font-size:12.5px;color:var(--mute);gap:8px">
    <div style="display:flex;align-items:center;gap:12px"><svg width="46" height="12"><path d="M2 6H44" stroke="#8C8780" stroke-width="1.1"/></svg>Débil</div>
    <div style="display:flex;align-items:center;gap:12px"><svg width="46" height="12"><path d="M2 6H44" stroke="#8C8780" stroke-width="3"/></svg>Fuerte</div>
   </div>
  </section>

  <section class="sec"><h2>Clústeres</h2><p class="hint">Ámbitos de interacción en Kennedy:</p>
   <div class="spheres">${Object.entries(SPH).map(([k,v])=>`<button class="sp" data-s="${k}" style="--c:${SPC[k]}">${v}</button>`).join('')}</div>
  </section>

  <section class="sec"><h2>Actores</h2>
   <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7E7A73" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar actor o institución" value="${esc(state.q)}" aria-label="Buscar actor"></label>
   <ul class="list" id="al"></ul>
  </section>`;
}

function actorList(){
  const q = state.q.trim().toLowerCase();
  document.getElementById('al').innerHTML = nodes.filter(n => !q || (n.name + ' ' + n.short).toLowerCase().includes(q)).sort((a,b) => b.deg - a.deg)
   .map(n => `<li><button class="row" data-id="${n.id}">
     <span class="av" style="border-color:${LOGOS.has(n.id)?SPC[n.sph]:'#4a4743'}">${avatar(n, 32)}</span>
     <span><span class="nm">${esc(n.short)}</span><span class="sub">${esc(n.name!==n.short?n.name:TYPES[n.cat])}</span></span>
     <span class="deg">${n.deg}</span>
   </button></li>`).join('');
}

function detail(n){
  const rows = [...n.out.map(l => ({l, o: l.target, d: 'Hacia'})), ...n.in.map(l => ({l, o: l.source, d: 'Desde'}))];
  const groups = Object.keys(CONV).map(k => [k, rows.filter(r => r.l.c === k)]).filter(g => g[1].length);
  return `
  <section class="sec"><button class="back" id="back">← Volver a toda la red</button>
   <div class="who">
    <div style="display:flex;align-items:center;gap:14px;margin-top:16px">
     <span class="av" style="width:52px;height:52px;border-color:${SPC[n.sph]};border-width:2px;flex:none">${avatar(n, 48)}</span>
     <div>
      <h3>${esc(n.name)}</h3>
      <div class="kind">${esc(n.nat)}</div>
     </div>
    </div>
    <div class="kind" style="margin-top:10px"><b>Clúster:</b> ${esc(SPH[n.sph])}</div>
    <div class="kind" style="margin-top:2px"><b>Nivel:</b> ${LV[n.lv]}</div>
    <p>${esc(n.fun)}</p>
    <div class="io"><div><b>${n.out.length}</b><span>relaciones que inicia</span></div><div><b>${n.in.length}</b><span>relaciones que recibe</span></div></div>
   </div>
  </section>
  <section class="sec">
   <h2>Relaciones con otros actores</h2>
   ${groups.map(([k,rs])=>`<div class="group"><div class="ghead">${sample(k,34)}${CONV[k].n}</div>
    ${rs.map(({l,o,d})=>`<button class="it" data-id="${o.id}">
      <div style="display:flex;align-items:center;gap:10px">
       <span class="av" style="width:30px;height:30px;border-color:${LOGOS.has(o.id)?SPC[o.sph]:'#4a4743'};flex:none">${avatar(o, 26)}</span>
       <div style="flex:1;min-width:0">
        <div class="dir">${d}</div>
        <div class="who2">${esc(o.name)}</div>
       </div>
      </div>
      <div class="ty" style="margin-left:40px">${esc(l.type)}${dots(l.w,CONV[k].c)}</div>
      <div class="ds" style="margin-left:40px">${esc(l.desc)}</div>
    </button>`).join('')}</div>`).join('')}
  </section>`;
}

function renderPanel(){
  if(state.sel){
    P.innerHTML = detail(state.sel);
    document.getElementById('back').onclick = () => { select(null, 'keep'); fitAll(); };
    P.scrollTop = 0;
  } else {
    P.innerHTML = overview();
    actorList();
    const q = document.getElementById('q');
    q.oninput = () => { state.q = q.value; actorList(); };
    P.querySelectorAll('.cv').forEach(b => b.onclick = () => {
      const k = b.dataset.c;
      state.conv.has(k) ? state.conv.delete(k) : state.conv.add(k);
      b.setAttribute('aria-pressed', state.conv.has(k));
      applyConv();
    });
    P.querySelectorAll('.sp').forEach(b => b.onclick = () => {
      const ns = nodes.filter(n => n.sph === b.dataset.s);
      if (MODE === 'd') fitTo(ns, 700, 2.0);
      else scrollToNode(ns[0]);
    });
    P.querySelectorAll('.inst-card').forEach(b => b.onclick = () => select(byId.get(b.dataset.id), 'list'));
  }
  P.querySelectorAll('[data-id]').forEach(b => b.onclick = () => select(byId.get(b.dataset.id), 'list'));
}

/* ---------- inicio ---------- */
renderPanel();
const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!reduce){
  gH.attr('opacity', 0).transition().duration(1000).attr('opacity', 1);
  nodeSel.attr('opacity', 0).transition().delay(n => 100 + Math.hypot(n.x - W/2, n.y - H/2) * .6).duration(450).attr('opacity', 1);
  linkSel.style('opacity', 0).transition().delay(600).duration(800).style('opacity', null);
}
requestAnimationFrame(() => { sizeMobile(); fitAll(0); document.fonts && document.fonts.ready.then(queue); });

let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if ((mobile() ? 'm' : 'd') !== MODE){ layout(); geometry(); if(state.sel) focus(state.sel); }
    sizeMobile(); fitAll(0);
  }, 180);
});
window.__net = {nodes, links};
</script>
</body>
</html>
