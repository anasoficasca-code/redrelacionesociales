<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red de actores de Kennedy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#EEEAE3;--soft:#B9B4AB;--mute:#7E7A73;--line:#1A1918;--faint:#2E2C29;
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box;font-style:normal}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:1fr 372px;height:100%}
.left{display:grid;grid-template-rows:auto 1fr;min-height:0}
header{padding:26px 32px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.05}
.lede{margin:8px 0 0;font-size:14px;line-height:1.5;color:var(--soft);max-width:58ch}
.nums{display:flex;gap:28px;flex:none}
.nums div{text-align:right}.nums b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1}
.nums span{font-size:12px;color:var(--mute)}
.stage{position:relative;min-height:0;background:radial-gradient(circle at 1px 1px,#171615 1px,transparent 1.3px) 0 0/24px 24px,#000}
#net{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#net:active{cursor:grabbing}
.zoom{position:absolute;right:18px;bottom:18px;display:flex;border:1px solid var(--faint);border-radius:999px;overflow:hidden;background:#000}
.zoom button{background:none;border:0;height:34px;padding:0 14px;cursor:pointer;font-size:13px;color:var(--soft)}
.zoom button+button{border-left:1px solid var(--faint)}
.zoom button:hover{color:var(--ink)}
button:focus-visible{outline:2px solid #9AA4FF;outline-offset:2px}

.neb{pointer-events:none}
.orbit{fill:none;stroke-opacity:.42;stroke-width:1;stroke-dasharray:1 5;pointer-events:none}
.crown{fill:none;stroke-width:1;stroke-opacity:.6;stroke-dasharray:2 3}
.glow{pointer-events:none}
.hlabel{font-weight:600;pointer-events:none;letter-spacing:.01em}
.link{fill:none;stroke-linecap:round;opacity:.5;mix-blend-mode:screen;transition:opacity .3s}
.node{cursor:pointer}
.node .ring{stroke-opacity:.95;transition:stroke .2s}
.node .icon{pointer-events:none}
.node .halo{fill:none;stroke:#fff;stroke-opacity:0}
.node.new .ring{stroke-dasharray:4 3}
.node text{fill:#E6E2DA;font-weight:500;pointer-events:none;paint-order:stroke;stroke:#000;stroke-linejoin:round}
.node,.hull,.hlabel{transition:opacity .3s}
.focus .node{opacity:.14}.focus .link{opacity:.04}.focus .neb,.focus .orbit{opacity:.4}
.focus .node.on{opacity:1}.focus .link.on{opacity:1}
.node.sel .halo{stroke-opacity:.5}
.node.sel .ring{stroke:#fff;stroke-opacity:1}
.off{display:none}
.particle{pointer-events:none}

.panel{border-left:1px solid var(--line);overflow-y:auto;background:#030303}
.sec{padding:22px 26px;border-bottom:1px solid var(--line)}
.sec h2{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sec .hint{margin:0 0 14px;font-size:12.5px;color:var(--mute);line-height:1.45}
.conv{display:flex;flex-direction:column;gap:2px}
.cv{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:12px;padding:8px 6px;border:0;background:none;text-align:left;border-radius:8px;cursor:pointer}
.cv:hover{background:#0f0e0d}
.cv[aria-pressed=false]{opacity:.32}
.cv .t{font-size:13.5px;color:var(--ink);line-height:1.3}
.cv .n{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:13px;color:var(--soft)}
.types div{display:flex;align-items:center;gap:9px}
.types .dash{width:22px;height:22px;border-radius:50%;border:1.3px dashed #E9E5DD;flex:none}
.spheres{display:flex;flex-wrap:wrap;gap:6px}
.sp{border:1px solid var(--faint);background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--soft);cursor:pointer}
.sp::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:0}
.sp:hover{color:var(--ink);border-color:#4a4743}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--faint);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:14px}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.row:hover .nm{color:#fff}
.av{width:32px;height:32px;border-radius:50%;border:1.2px solid #6d6963;display:grid;place-items:center;color:#E9E5DD}
.nm{display:block;font-size:14px;font-weight:500;line-height:1.25}
.sub{display:block;font-size:12px;color:var(--mute);line-height:1.35;margin-top:2px}
.deg{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.back{background:none;border:1px solid var(--faint);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer}
.who h3{margin:16px 0 0;font-size:22px;font-weight:600;line-height:1.15;letter-spacing:-.015em}
.who .kind{font-size:13px;color:var(--mute);margin-top:6px}
.who p{font-size:14px;line-height:1.5;color:var(--soft);margin:12px 0 0}
.io{display:flex;gap:22px;margin-top:16px}
.io b{font-size:22px;font-weight:600;display:block;line-height:1}.io span{font-size:12px;color:var(--mute)}
.group{margin-top:18px}
.group:first-child{margin-top:0}
.ghead{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--soft);margin-bottom:4px}
.it{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer}
.it .dir{font-size:12px;color:var(--mute)}
.it .who2{font-size:14px;font-weight:500;color:var(--ink);margin-top:1px}
.it .ty{font-size:12.5px;color:var(--soft);margin-top:3px}
.it .ds{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.4}
.dots{display:inline-flex;gap:3px;margin-left:8px;vertical-align:1px}
.dots i{width:5px;height:5px;border-radius:50%;background:#3a3835}.dots i.f{background:var(--c)}
.mob{display:none}
.lvls{display:flex;flex-direction:column;gap:8px}.lvls div{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:center;font-size:13px;line-height:1.4;color:var(--soft)}.lvls b{color:var(--ink);font-weight:600}

@media (max-width:900px){
  .app{display:block;height:auto}
  .left{display:block}
  header{display:block;padding:22px 18px 14px}
  h1{font-size:27px}
  .nums{margin-top:16px;gap:22px}.nums div{text-align:left}
  .stage{height:auto;border-bottom:1px solid var(--line);display:block}
  #net{height:auto}
  .zoom{display:none}
  .panel{border-left:0;overflow:visible}
  .sec{padding:20px 18px}
  .mob{display:block}
}
@media (prefers-reduced-motion:reduce){.particle{display:none}}
</style>
</head>

<script>const DATA={"nodes":[{"id":"A01","name":"Corabastos S. A.","nat":"Empresa / persona jurídica","fun":"Administra y coordina actividades comerciales y operativas de la central.","sph":"cor","cat":"emp","short":"Corabastos S.A.","lv":2},{"id":"A02","name":"Asamblea General de Accionistas de Corabastos","nat":"Órgano de gobierno","fun":"Participa en decisiones societarias de la empresa.","sph":"cor","cat":"ins","short":"Asamblea de accionistas","lv":1},{"id":"A03","name":"Junta Directiva de Corabastos","nat":"Órgano de gobierno","fun":"Orienta y supervisa decisiones de administración.","sph":"cor","cat":"ins","short":"Junta Directiva Corabastos","lv":1},{"id":"A04","name":"Gerencia y administración de Corabastos","nat":"Unidad administrativa","fun":"Coordina operación, reglas internas y servicios de la central.","sph":"cor","cat":"emp","short":"Gerencia Corabastos","lv":2},{"id":"A06","name":"Comerciantes mayoristas de frutas y hortalizas","nat":"Personas / actividad económica","fun":"Venden productos a compradores comerciales y otros comerciantes.","sph":"cor","cat":"per","short":"Mayoristas de frutas y hortalizas","lv":2},{"id":"A07","name":"Comerciantes mayoristas de tubérculos, granos y otros abarrotes","nat":"Personas / actividad económica","fun":"Distribuyen productos alimentarios a compradores comerciales.","sph":"cor","cat":"per","short":"Mayoristas de tubérculos y granos","lv":2},{"id":"A08","name":"Productores agrícolas y asociaciones proveedoras","nat":"Personas y organizaciones","fun":"Proveen productos agrícolas para su comercialización.","sph":"cor","cat":"per","short":"Productores agrícolas","lv":3},{"id":"A09","name":"Intermediarios y comisionistas de productos agrícolas","nat":"Personas / actividad económica","fun":"Negocian compras, ventas o consignación de productos.","sph":"cor","cat":"per","short":"Intermediarios y comisionistas","lv":3},{"id":"A10","name":"Empresas transportadoras de alimentos","nat":"Empresa / persona jurídica","fun":"Contratan o coordinan el transporte de carga alimentaria.","sph":"log","cat":"emp","short":"Empresas transportadoras","lv":2},{"id":"A11","name":"Conductores de camiones de alimentos","nat":"Personas naturales por rol laboral","fun":"Conducen la carga entre proveedores, central y compradores.","sph":"log","cat":"per","short":"Conductores de camión","lv":3},{"id":"A13","name":"Coteros y trabajadores de cargue y descargue","nat":"Personas naturales por rol laboral","fun":"Cargan, descargan y movilizan bultos o cajas.","sph":"log","cat":"per","short":"Coteros","lv":3},{"id":"A14","name":"Coordinadores de logística y cargue/descargue","nat":"Personas naturales por rol laboral","fun":"Organizan turnos, maniobras o secuencias de cargue y despacho.","sph":"log","cat":"per","short":"Coordinadores de cargue","lv":2},{"id":"A15","name":"Tenderos y propietarios de pequeños comercios de alimentos","nat":"Personas / actividad económica","fun":"Compran y venden alimentos al por menor.","sph":"con","cat":"per","short":"Tenderos","lv":3},{"id":"A16","name":"Personas encargadas de abastecer tiendas y minimercados","nat":"Personas naturales por rol laboral","fun":"Seleccionan proveedores, hacen pedidos y recogen o reciben productos.","sph":"con","cat":"per","short":"Surtidores de tiendas","lv":3},{"id":"A17","name":"Restaurantes y cafeterías","nat":"Establecimientos comerciales","fun":"Compran insumos y venden comidas o bebidas preparadas.","sph":"con","cat":"emp","short":"Restaurantes y cafeterías","lv":3},{"id":"A18","name":"Responsables de compras de restaurantes y cafeterías","nat":"Personas naturales por rol laboral","fun":"Eligen proveedores, comparan precios y coordinan pedidos.","sph":"con","cat":"per","short":"Compradores de restaurantes","lv":3},{"id":"A19","name":"Vendedores de alimentos preparados","nat":"Personas / actividad económica","fun":"Preparan o venden comidas listas para consumo.","sph":"con","cat":"per","short":"Vendedores de comida preparada","lv":3},{"id":"A20","name":"Hogares que compran alimentos para consumo familiar","nat":"Hogares / consumidores","fun":"Compran productos al detal y generan demanda alimentaria.","sph":"con","cat":"hog","short":"Hogares compradores","lv":4},{"id":"A21","name":"Repartidores de última milla de alimentos","nat":"Personas naturales por rol laboral","fun":"Entregan pedidos a hogares, tiendas o restaurantes.","sph":"log","cat":"per","short":"Repartidores","lv":3},{"id":"A23","name":"Comercios y restaurantes que generan residuos","nat":"Establecimientos / generadores","fun":"Producen residuos orgánicos, empaques y materiales aprovechables.","sph":"res","cat":"emp","short":"Comercios generadores de residuos","lv":4},{"id":"A24","name":"Hogares que separan residuos aprovechables","nat":"Hogares / participantes","fun":"Separan papel, cartón, plástico, vidrio u otros materiales.","sph":"res","cat":"hog","short":"Hogares que separan","lv":4},{"id":"A25","name":"Organizaciones de recicladores de oficio","nat":"Organización / persona jurídica o colectivo","fun":"Coordinan actividades, afiliación o comercialización de materiales.","sph":"res","cat":"org","short":"Organizaciones de recicladores","lv":2},{"id":"A26","name":"Recicladores de oficio vinculados a una organización","nat":"Personas naturales por rol laboral","fun":"Recogen, seleccionan y entregan materiales aprovechables.","sph":"res","cat":"per","short":"Recicladores asociados","lv":3},{"id":"A27","name":"Recicladores de oficio independientes","nat":"Personas naturales por rol laboral","fun":"Recuperan materiales sin estar necesariamente vinculados a una organización.","sph":"res","cat":"per","short":"Recicladores independientes","lv":3},{"id":"A28","name":"Ciudad Limpia, operador de aseo de Kennedy","nat":"Empresa / persona jurídica","fun":"Organiza o ejecuta labores de recolección y transporte de residuos.","sph":"res","cat":"emp","short":"Ciudad Limpia (aseo)","lv":2},{"id":"A29","name":"Conductores de camiones recolectores","nat":"Personas naturales por rol laboral","fun":"Conducen vehículos de recolección de residuos.","sph":"res","cat":"per","short":"Conductores recolectores","lv":3},{"id":"A31","name":"Operarios de recolección de residuos","nat":"Personas naturales por rol laboral","fun":"Retiran y cargan residuos durante las rutas de recolección.","sph":"res","cat":"per","short":"Operarios de recolección","lv":3},{"id":"A32","name":"UAESP","nat":"Entidad pública distrital","fun":"Participa en la gestión pública de servicios de aseo y aprovechamiento.","sph":"res","cat":"pub","short":"UAESP","lv":1},{"id":"A33","name":"Secretaría Distrital de Ambiente","nat":"Entidad pública distrital","fun":"Interviene en asuntos de gestión y control ambiental dentro de sus competencias.","sph":"res","cat":"pub","short":"Secretaría de Ambiente","lv":1},{"id":"A34","name":"Alcaldía Local de Kennedy","nat":"Institución pública local","fun":"Canaliza gestiones, programas y respuestas institucionales de escala local.","sph":"gob","cat":"pub","short":"Alcaldía Local","lv":1},{"id":"A35","name":"Juntas de Acción Comunal (JAC)","nat":"Organización comunitaria","fun":"Representan intereses colectivos y desarrollan actividades comunitarias.","sph":"gob","cat":"org","short":"Juntas de Acción Comunal","lv":2},{"id":"A36","name":"Presidentes y representantes de JAC","nat":"Personas naturales por rol comunitario","fun":"Transmiten solicitudes y coordinan comunicación con entidades y residentes.","sph":"gob","cat":"per","short":"Presidentes de JAC","lv":2},{"id":"A37","name":"Residentes que participan en reuniones o presentan solicitudes","nat":"Personas naturales por rol comunitario","fun":"Comunican necesidades, quejas o propuestas a organizaciones e instituciones.","sph":"gob","cat":"per","short":"Residentes participantes","lv":4},{"id":"A38","name":"Estación de Policía Kennedy (Policía Metropolitana de Bogotá)","nat":"Institución pública","fun":"Atiende asuntos de seguridad y convivencia dentro de sus competencias.","sph" <script>
(function(){
const CONV={

};
for(const k of Object.keys(CONV)) if(!DATA.links.some(l=>l.c===k)) delete CONV[k];
const LV={1:'Deciden',2:'Coordinan y gestionan',3:'Ejecutan',4:'Participan y reciben'};

const LVR={d:{1:27,2:17,3:11,4:8.5},m:{1:30,2:20,3:13.5,4:10.5}};
const SPH={cor:'Corabastos y comercio mayorista',log:'Logística y transporte de carga',con:'Comercio barrial y consumo',res:'Residuos, reciclaje y agua',gob:'Gobierno local y comunidad',edu:'Educación',sal:'Salud',mov:'Transporte público'};
const RING=['log','res','gob','sal','edu','mov','con'];
const SPC={cor:'#E3A65B',log:'#5DB7DE',con:'#E8806F',res:'#9ECB5C',gob:'#A291EA',edu:'#DB86C6',sal:'#5FCDA4',mov:'#CDBD8E'};
const TYPES={pub:'Entidad pública',emp:'Empresa o establecimiento',ins:'Órgano, comité o asamblea',org:'Organización comunitaria',per:'Personas por su rol',hog:'Hogares y usuarios',obj:'Vehículo u objeto'};
const mobile=()=>window.matchMedia('(max-width:900px)').matches;
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

const nodes=DATA.nodes.map(d=>({...d})), byId=new Map(nodes.map(n=>[n.id,n]));
const links=DATA.links.map((l,i)=>({...l,i,source:byId.get(l.s),target:byId.get(l.t)}));
nodes.forEach(n=>{n.out=[];n.in=[]});links.forEach(l=>{l.source.out.push(l);l.target.in.push(l)});
nodes.forEach(n=>{n.deg=n.in.length+n.out.length;n.nb=new Set([...n.out.map(l=>l.t),...n.in.map(l=>l.s)])});
document.getElementById('nA').textContent=nodes.length;document.getElementById('nL').textContent=links.length;

/* ---------- layout ---------- */
let W,H,MODE;const center={};
const ORB={d:{2:92,3:142,4:178},m:{2:100,3:152,4:190}};
const CL={};
function layout(){
  MODE=mobile()?'m':'d';
  const D=MODE==='d';
  if(D){W=1860;H=1360;const cx=W/2,cy=H/2+10;center.cor=[cx,cy];
    RING.forEach((k,i)=>{const a=-Math.PI/2+(i+.5)*2*Math.PI/RING.length;center[k]=[cx+Math.cos(a)*640,cy+Math.sin(a)*480]});}
  else{W=900;H=1900;const G=[['cor','log'],['con','res'],['gob','sal'],['edu','mov']];
    G.forEach((row,r)=>row.forEach((k,c)=>center[k]=[225+c*450,265+r*465]));}
  const O=ORB[MODE];
  Object.keys(SPH).forEach(k=>{const n1=nodes.filter(n=>n.sph===k&&n.lv===1).length;CL[k]={n1,R:O[4]+30}});
  const target=n=>n.lv===1?(CL[n.sph].n1>1?(D?42:46):0):O[n.lv];
  let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
  nodes.forEach(n=>{n.r=LVR[MODE][n.lv];const c=center[n.sph],a=rnd()*6.283,t=target(n);n.x=c[0]+Math.cos(a)*t;n.y=c[1]+Math.sin(a)*t;n.vx=n.vy=0});
  function orbit(alpha){nodes.forEach(n=>{const c=center[n.sph],dx=n.x-c[0],dy=n.y-c[1],d=Math.hypot(dx,dy)||1e-3,t=target(n);
    const k=(d-t)/d*.35;n.vx-=dx*k;n.vy-=dy*k})}
  const sim=d3.forceSimulation(nodes)
   .force('l',d3.forceLink(links).distance(60).strength(l=>l.source.sph===l.target.sph?.05:.004))
   .force('q',d3.forceManyBody().strength(n=>-40-n.r*3).distanceMax(160))
   .force('o',orbit)
   .force('c',d3.forceCollide(n=>n.r+(D?9:9)).iterations(4)).stop();
  for(let i=0;i<500;i++)sim.tick();
}
layout();

/* ---------- svg ---------- */
const svg=d3.select('#net').attr('preserveAspectRatio','xMidYMid meet');
const defs=svg.append('defs');
Object.entries(CONV).forEach(([k,v])=>defs.append('marker').attr('id','m-'+k).attr('viewBox','0 0 10 10').attr('refX',9.6).attr('refY',5)
  .attr('markerWidth',MODE==='d'?11:14).attr('markerHeight',MODE==='d'?11:14).attr('orient','auto').attr('markerUnits','userSpaceOnUse')
  .append('path').attr('d','M0,0.6L10,5L0,9.4L2.6,5z').attr('fill',v.c));
Object.entries(SPC).forEach(([k,c])=>{const g=defs.append('radialGradient').attr('id','g-'+k);g.append('stop').attr('offset','0').attr('stop-color',c).attr('stop-opacity',.22);g.append('stop').attr('offset','.55').attr('stop-color',c).attr('stop-opacity',.08);g.append('stop').attr('offset','1').attr('stop-color',c).attr('stop-opacity',0)});
const glow=defs.append('filter').attr('id','glow').attr('x','-80%').attr('y','-80%').attr('width','260%').attr('height','260%');glow.append('feGaussianBlur').attr('stdDeviation',6);
const root=svg.append('g');
const gH=root.append('g'),gL=root.append('g'),gP=root.append('g'),gN=root.append('g'),gT=root.append('g');

function path(l){
  const s=l.source,t=l.target,dx=t.x-s.x,dy=t.y-s.y,d=Math.hypot(dx,dy)||1;
  const back=links.some(o=>o.s===l.t&&o.t===l.s);
  const k=back?.2:.14,mx=(s.x+t.x)/2-dy*k,my=(s.y+t.y)/2+dx*k;
  const ex=t.x-mx,ey=t.y-my,ed=Math.hypot(ex,ey)||1,sx0=mx-s.x,sy0=my-s.y,sd=Math.hypot(sx0,sy0)||1;
  const pad=3;
  return `M${s.x+sx0/sd*(s.r+2)},${s.y+sy0/sd*(s.r+2)}Q${mx},${my} ${t.x-ex/ed*(t.r+pad)},${t.y-ey/ed*(t.r+pad)}`;
}
const wid=w=>MODE==='d'?[0,1.3,2.1,3.1][w]:[0,1.8,2.8,3.9][w];
const linkSel=gL.selectAll('path').data(links).join('path').attr('class','link')
  .attr('id',l=>'p'+l.i).attr('stroke',l=>CONV[l.c].c).attr('stroke-dasharray',l=>CONV[l.c].d)
  .attr('marker-end',l=>`url(#m-${l.c})`);
const nodeSel=gN.selectAll('g').data(nodes).join('g').attr('class',n=>'node'+(n.new?' new':''))
  .attr('tabindex',0).attr('role','button').attr('aria-label',n=>n.name);
nodeSel.append('circle').attr('class','glow').attr('filter','url(#glow)');
nodeSel.filter(n=>n.lv===1).append('circle').attr('class','crown');
nodeSel.append('circle').attr('class','halo');
nodeSel.append('circle').attr('class','ring');
nodeSel.append('use').attr('class','icon').attr('href',n=>'#i-'+n.cat);
nodeSel.append('text');

function geometry(){
  svg.attr('viewBox',`0 0 ${W} ${H}`);
  linkSel.attr('d',path).attr('stroke-width',l=>wid(l.w));
  nodeSel.attr('transform',n=>`translate(${n.x},${n.y})`);
  nodeSel.select('.glow').attr('r',n=>n.r*(n.lv===1?1.25:1.05)).attr('fill',n=>SPC[n.sph]).attr('opacity',n=>n.lv===1?.55:n.lv===2?.35:.2);
  nodeSel.select('.crown').attr('r',n=>n.r+(MODE==='d'?7:8)).attr('stroke',n=>SPC[n.sph]);
  nodeSel.select('.ring').attr('r',n=>n.r).attr('stroke-width',n=>n.lv===1?2.4:n.lv===2?1.8:1.3).attr('stroke',n=>SPC[n.sph])
    .attr('fill',n=>n.lv===4?SPC[n.sph]:d3.interpolateRgb('#000',SPC[n.sph])(n.lv===1?.28:.14));
  nodeSel.select('.halo').attr('r',n=>n.r+7).attr('stroke-width',MODE==='d'?6:8);
  nodeSel.select('.icon').style('color',n=>n.lv===4?'#0b0b0b':n.lv===1?'#fff':SPC[n.sph]).attr('width',n=>n.r*1.25).attr('height',n=>n.r*1.25).attr('x',n=>-n.r*.625).attr('y',n=>-n.r*.625);
  const O=ORB[MODE];
  const cls=Object.keys(SPH).map(k=>{const c=center[k],R=d3.max(nodes.filter(n=>n.sph===k),n=>Math.hypot(n.x-c[0],n.y-c[1])+n.r)+26;return {k,cx:c[0],cy:c[1],R,top:c[1]-R+4,bot:c[1]+R}});
  gH.selectAll('*').remove();
  cls.forEach(c=>{
    gH.append('circle').attr('class','neb').attr('cx',c.cx).attr('cy',c.cy).attr('r',c.R+40).attr('fill',`url(#g-${c.k})`);
    [2,3,4].forEach(l=>{if(nodes.some(n=>n.sph===c.k&&n.lv===l))gH.append('circle').attr('class','orbit o'+l).attr('cx',c.cx).attr('cy',c.cy).attr('r',O[l]).attr('stroke',SPC[c.k])});
  });
  gT.selectAll('text').data(cls).join('text').attr('class','hlabel').attr('fill',d=>SPC[d.k]).attr('text-anchor','middle').text(d=>SPH[d.k])
    .each(function(d){d.ly=d.top;d3.select(this).attr('x',d.cx).attr('y',d.ly)});
}
geometry();

/* ---------- etiquetas sin superposición ---------- */
const meas=document.createElement('canvas').getContext('2d');
let T=d3.zoomIdentity;
function unitPx(){const r=svg.node().getBoundingClientRect();return Math.min(r.width/W,r.height/H)}
function offs(){const r=svg.node().getBoundingClientRect(),u=unitPx();return [(r.width-W*u)/2,(r.height-H*u)/2]}
function placeLabels(){
  const u=unitPx()*T.k, fs=mobile()?10.5:11, fu=fs/u;
  meas.font=`500 ${fs}px "Instrument Sans", sans-serif`;
  const R=svg.node().getBoundingClientRect(), boxes=[], out=b=>b[0]<4||b[1]<4||b[2]>R.width-4||b[3]>R.height-4, ov=(a,o)=>a[0]<o[2]&&a[2]>o[0]&&a[1]<o[3]&&a[3]>o[1], nb=[], hit=(b,soft)=>out(b)||boxes.some(o=>ov(b,o))||(!soft&&nb.some(o=>ov(b,o)));
  const O=offs(), sx=n=>(n.x*T.k+T.x)*unitPx()+O[0], sy=n=>(n.y*T.k+T.y)*unitPx()+O[1];
  const vis=nodes.filter(n=>!n.hidden);
  vis.filter(n=>!state.sel||n===state.sel||state.sel.nb.has(n.id)).forEach(n=>{const r=n.r*u,x=sx(n),y=sy(n);nb.push([x-r,y-r,x+r,y+r])});
  // centros de pantalla: unitPx asume meet; corrige el desplazamiento del viewBox centrado

  // etiquetas de ámbito primero
  const hs=mobile()?11.5:12.5, hu=hs/u;
  meas.font=`600 ${hs}px "Instrument Sans", sans-serif`;
  gT.selectAll('text').attr('font-size',hu).each(function(d){
    const w=meas.measureText(SPH[d.k]).width, x=(d.cx*T.k+T.x)*unitPx()+O[0];let ok=false;
    if(!state.sel&&!state.hov){const ly=d.top-6,y=(ly*T.k+T.y)*unitPx()+O[1];boxes.push([x-w/2-4,y-hs,x+w/2+4,y+4]);d3.select(this).attr('y',ly);ok=true}
    d3.select(this).style('display',ok?null:'none');
  });
  meas.font=`500 ${fs}px "Instrument Sans", sans-serif`;
  const sel=state.sel, prio=n=>(sel&&(n===sel?3:sel.nb.has(n.id)?2:0))+(n===state.hov?3:0);
  const order=[...vis].sort((a,b)=>prio(b)-prio(a)||b.deg-a.deg);
  const shown=new Map();
  order.forEach(n=>{
    const base=!sel&&!state.hov&&(n.lv<=1||T.k>1.5&&n.lv<=2||T.k>2.2);
    if(!(base||n===sel||n===state.hov||(sel&&sel.nb.has(n.id))||(!sel&&state.hov&&state.hov.nb.has(n.id))))return;
    const w=meas.measureText(n.short).width,r=n.r*u,x=sx(n),y=sy(n),g=5;
    const cand=[[x+r+g,y-fs/2-1,'start',r+g,fs*.36],[x-r-g-w,y-fs/2-1,'end',-(r+g),fs*.36],[x-w/2,y+r+g,'middle',0,r+g+fs*.82],[x-w/2,y-r-g-fs,'middle',0,-(r+g)-fs*.2]];
    const soft=n===sel||n===state.hov;
    for(const [bx,by,anc,dx,dy] of cand){const b=[bx-2,by-1,bx+w+2,by+fs+2];
      if(!hit(b,soft)){boxes.push(b);shown.set(n,[anc,dx/u,dy/u]);break}}
  });
  nodeSel.select('text').each(function(n){const s=shown.get(n),t=d3.select(this);
    if(!s){t.style('display','none');return}
    t.style('display',null).attr('text-anchor',s[0]).attr('x',s[1]).attr('y',s[2]).attr('font-size',fu).attr('stroke-width',3/u).attr('font-weight',(n===sel||n===state.hov)?600:500).text(n.short)});
}
let raf;const queue=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(placeLabels)};

/* ---------- zoom ---------- */
const zoom=d3.zoom().scaleExtent([.6,6]).on('zoom',e=>{T=e.transform;root.attr('transform',T);queue()});
svg.call(zoom).on('dblclick.zoom',null);
function fitTo(ns,dur=700,maxK=3){
  const pad=MODE==='d'?50:24, px=MODE==='d'?120:40;
  const x0=d3.min(ns,n=>n.x-n.r)-px,x1=d3.max(ns,n=>n.x+n.r)+px,y0=d3.min(ns,n=>n.y-n.r)-pad-28,y1=d3.max(ns,n=>n.y+n.r)+pad+28;
  const k=Math.min(maxK,W/(x1-x0),H/(y1-y0));
  svg.transition().duration(dur).call(zoom.transform,d3.zoomIdentity.translate(W/2-k*(x0+x1)/2,H/2-k*(y0+y1)/2).scale(k));
}
const fitAll=(d=700)=>{if(MODE==='m')return;svg.transition().duration(d).call(zoom.transform,d3.zoomIdentity)};
function sizeMobile(){if(MODE==='m'){const w=svg.node().parentNode.getBoundingClientRect().width;svg.style('height',(w*H/W)+'px');svg.on('.zoom',null);T=d3.zoomIdentity;root.attr('transform',null)}else{svg.style('height',null);svg.call(zoom).on('dblclick.zoom',null)}queue()}
function scrollToNode(n){const r=svg.node().getBoundingClientRect();window.scrollTo({top:window.scrollY+r.top+n.y*unitPx()-window.innerHeight*.4,behavior:'smooth'})}
document.getElementById('zin').onclick=()=>svg.transition().call(zoom.scaleBy,1.4);
document.getElementById('zout').onclick=()=>svg.transition().call(zoom.scaleBy,1/1.4);
document.getElementById('zfit').onclick=()=>{select(null);fitAll()};

/* ---------- estado, filtros, selección ---------- */
const state={sel:null,hov:null,conv:new Set(Object.keys(CONV)),q:''};
function applyConv(){
  linkSel.classed('off',l=>!state.conv.has(l.c));
  nodes.forEach(n=>n.hidden=false);
  if(state.sel)focus(state.sel);
  queue();
}
function focus(n){
  svg.classed('focus',!!n);
  nodeSel.classed('on',d=>n&&(d===n||n.nb.has(d.id))).classed('sel',d=>d===n);
  linkSel.classed('on',l=>n&&(l.source===n||l.target===n));
  gP.selectAll('*').remove();
  if(n&&!window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    [...n.out,...n.in].filter(l=>state.conv.has(l.c)).forEach((l,j)=>{
      for(let q=0;q<2;q++){
        const c=gP.append('circle').attr('class','particle').attr('r',MODE==='d'?2.6:3.4).attr('fill',CONV[l.c].c);
        c.append('animateMotion').attr('dur',(2.4+(j%3)*.3)+'s').attr('repeatCount','indefinite').attr('begin',(q*1.2+j*.07)+'s')
         .append('mpath').attr('href','#p'+l.i);
      }
    });
  }
}
function select(n,how){
  state.sel=n;focus(n);renderPanel();queue();
  if(n&&how!=='keep'&&MODE==='d'){fitTo([n,...[...n.nb].map(i=>byId.get(i))],650,2)}
  if(n&&MODE==='m'&&how==='list')scrollToNode(n);
}
nodeSel.on('mouseenter',(e,n)=>{state.hov=n;if(!state.sel){focus(n)}queue()})
 .on('mouseleave',()=>{state.hov=null;if(!state.sel)focus(null);queue()})
 .on('click',(e,n)=>{e.stopPropagation();select(n,'node')})
 .on('keydown',(e,n)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n,'node')}});
svg.on('click',()=>{if(state.sel){select(null,'keep')}});

/* ---------- panel ---------- */
const P=document.getElementById('panel');
const ic=(cat,s=18)=>`<svg width="${s}" height="${s}"><use href="#i-${cat}"/></svg>`;
const sample=(k,w=46)=>`<svg width="${w}" height="12" aria-hidden="true"><path d="M2 6H${w-9}" stroke="${CONV[k].c}" stroke-width="2.4" stroke-linecap="round" ${CONV[k].d?`stroke-dasharray="${CONV[k].d}"`:''}/><path d="M${w-10} 2.2 ${w-2} 6 ${w-10} 9.8z" fill="${CONV[k].c}"/></svg>`;
const dots=(w,c)=>`<span class="dots" style="--c:${c}" title="Intensidad ${w} de 3">${[1,2,3].map(i=>`<i class="${i<=w?'f':''}"></i>`).join('')}</span>`;
function overview(){
  const counts=d3.rollup(links,v=>v.length,l=>l.c);
  return `
  <section class="sec"><h2>Quién decide y quién ejecuta</h2>
   <p class="hint">Cada clúster es una constelación: en el centro, grande y con corona, quien decide; en los anillos de afuera, quienes coordinan, ejecutan y reciben.</p>
   <div class="lvls">${[1,2,3,4].map(l=>{const r=LVR.d[l];return `<div><svg width="74" height="74" viewBox="0 0 74 74"><circle cx="37" cy="37" r="${r}" fill="#E9E5DD" opacity="${l===1?.35:l===2?.2:.1}" filter="url(#glow)"/>${l===1?`<circle cx="37" cy="37" r="${r+7}" fill="none" stroke="#E9E5DD" stroke-dasharray="2 3" stroke-opacity=".6"/>`:''}<circle cx="37" cy="37" r="${r}" fill="${l===4?'#E9E5DD':'#1a1917'}" stroke="#E9E5DD" stroke-width="${l===1?2.4:l===2?1.8:1.3}"/></svg><span><b>${LV[l]}</b><br>${LVD[l]}</span></div>`}).join('')}</div>
  </section>
  <section class="sec"><h2>Convenciones de interacción</h2>
   <p class="hint">Color y trazo dicen qué tipo de relación es; el grosor, qué tan fuerte. Toca una convención para ocultarla o mostrarla.</p>
   <div class="conv">${Object.entries(CONV).map(([k,v])=>`<button class="cv" data-c="${k}" aria-pressed="${state.conv.has(k)}">${sample(k)}<span class="t">${v.n}</span><span class="n">${counts.get(k)||0}</span></button>`).join('')}</div>
   <div class="conv" style="margin-top:12px;font-size:12.5px;color:var(--mute);gap:8px">
    <div style="display:flex;align-items:center;gap:12px"><svg width="46" height="12"><path d="M2 6H44" stroke="#8C8780" stroke-width="1.1"/></svg>Débil</div>
    <div style="display:flex;align-items:center;gap:12px"><svg width="46" height="12"><path d="M2 6H44" stroke="#8C8780" stroke-width="3"/></svg>Fuerte</div>
   </div>
  </section>
  <section class="sec"><h2>Tipos de actor</h2><p class="hint">Toca un círculo para ver su nombre y sus relaciones.</p>
   <div class="types">${Object.entries(TYPES).map(([k,v])=>`<div><span class="av" style="width:28px;height:28px">${ic(k,16)}</span>${v}</div>`).join('')}
   <div><span class="dash"></span>Añadido a tu Excel</div></div>
  </section>
  <section class="sec"><h2>Clústeres</h2><p class="hint">Cada constelación de color es un clúster. Toca uno para ir a él.</p>
   <div class="spheres">${Object.entries(SPH).map(([k,v])=>`<button class="sp" data-s="${k}" style="--c:${SPC[k]}">${v}</button>`).join('')}</div>
  </section>
  <section class="sec"><h2>Actores</h2>
   <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7E7A73" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar actor" value="${esc(state.q)}" aria-label="Buscar actor"></label>
   <ul class="list" id="al"></ul>
  </section>`;
}
function actorList(){
  const q=state.q.trim().toLowerCase();
  document.getElementById('al').innerHTML=nodes.filter(n=>!q||(n.name+' '+n.short).toLowerCase().includes(q)).sort((a,b)=>b.deg-a.deg)
   .map(n=>`<li><button class="row" data-id="${n.id}"><span class="av">${ic(n.cat)}</span><span><span class="nm">${esc(n.short)}</span><span class="sub">${esc(n.name!==n.short?n.name:TYPES[n.cat])}</span></span><span class="deg">${n.deg}</span></button></li>`).join('');
}
function detail(n){
  const rows=[...n.out.map(l=>({l,o:l.target,d:'Hacia'})),...n.in.map(l=>({l,o:l.source,d:'Desde'}))];
  const groups=Object.keys(CONV).map(k=>[k,rows.filter(r=>r.l.c===k)]).filter(g=>g[1].length);
  return `
  <section class="sec"><button class="back" id="back">Volver a toda la red</button>
   <div class="who"><h3>${esc(n.name)}</h3><div class="kind">${esc(n.nat)}</div><div class="kind" style="margin-top:2px">Clúster: ${esc(SPH[n.sph])}</div><div class="kind" style="margin-top:2px">Nivel: ${LV[n.lv]}</div>
   <p>${esc(n.fun)}</p>
   <div class="io"><div><b>${n.out.length}</b><span>relaciones que inicia</span></div><div><b>${n.in.length}</b><span>relaciones que recibe</span></div></div></div>
  </section>
  <section class="sec">${groups.map(([k,rs])=>`<div class="group"><div class="ghead">${sample(k,34)}${CONV[k].n}</div>
   ${rs.map(({l,o,d})=>`<button class="it" data-id="${o.id}"><div class="dir">${d}</div><div class="who2">${esc(o.name)}</div>
    <div class="ty">${esc(l.type)}${dots(l.w,CONV[k].c)}</div><div class="ds">${esc(l.desc)}</div></button>`).join('')}</div>`).join('')}
  </section>`;
}
function renderPanel(){
  if(state.sel){P.innerHTML=detail(state.sel);document.getElementById('back').onclick=()=>{select(null,'keep');fitAll()};P.scrollTop=0}
  else{P.innerHTML=overview();actorList();
   const q=document.getElementById('q');q.oninput=()=>{state.q=q.value;actorList()};
   P.querySelectorAll('.cv').forEach(b=>b.onclick=()=>{const k=b.dataset.c;state.conv.has(k)?state.conv.delete(k):state.conv.add(k);b.setAttribute('aria-pressed',state.conv.has(k));applyConv()});
   P.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{const ns=nodes.filter(n=>n.sph===b.dataset.s);if(MODE==='d')fitTo(ns,700,2.2);else scrollToNode(ns[0])});
  }
  P.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>select(byId.get(b.dataset.id),'list'));
}

/* ---------- inicio ---------- */
renderPanel();
const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!reduce){
  gH.attr('opacity',0).transition().duration(1200).attr('opacity',1);
  nodeSel.attr('opacity',0).transition().delay(n=>120+Math.hypot(n.x-W/2,n.y-H/2)*.8).duration(450).attr('opacity',1);
  linkSel.style('opacity',0).transition().delay(700).duration(900).style('opacity',null);
}
requestAnimationFrame(()=>{sizeMobile();fitAll(0);document.fonts&&document.fonts.ready.then(queue)});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if((mobile()?'m':'d')!==MODE){layout();geometry();if(state.sel)focus(state.sel)}
  sizeMobile();fitAll(0)},180)});
window.__net={nodes,links};
})();
</script>
</body>
</html>
