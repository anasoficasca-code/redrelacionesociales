<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de actores de Kennedy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--ink:#ECE8E1;--mute:#8E8A83;--faint:#3A3835;--line:#1E1D1B;--panel:#050505;
  --neg:#FF5A4E;
  --gob:#86A8FF;--cor:#F2AE45;--res:#B9D44A;--amb:#3FD4B2;--sal:#F2829F;--edu:#B9A0FF;--mov:#D9C49A;--hog:#F4F1EA;
  --ui:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;font-style:normal}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:1fr 410px;height:100%}
.stage{position:relative;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,#1b1a18 1px,transparent 1.2px) 0 0/22px 22px,#000}
#net{width:100%;height:100%;display:block;cursor:grab}
#net:active{cursor:grabbing}
.masthead{position:absolute;left:16px;top:14px;max-width:430px;pointer-events:none;background:rgba(0,0,0,.86);padding:12px 14px 14px;border-radius:12px;z-index:2}
.masthead h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em;margin:0}
.masthead p{margin:10px 0 0;color:var(--mute);font-size:13.5px;line-height:1.45;max-width:36ch}
.controls{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.86);padding:10px;border-radius:14px;z-index:2}
.seg{display:inline-flex;border:1px solid var(--faint);border-radius:999px;padding:3px;background:#000}
.seg button{background:none;border:0;padding:7px 14px;border-radius:999px;font-size:12.5px;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#000}
.seg button:focus-visible,.chip:focus-visible,.row:focus-visible,.back:focus-visible{outline:2px solid var(--gob);outline-offset:2px}
.evi{display:flex;gap:6px;flex-wrap:wrap}
.zoom{position:absolute;right:20px;bottom:24px;display:flex;flex-direction:column;border:1px solid var(--faint);border-radius:10px;overflow:hidden}
.zoom button{background:#000;border:0;width:34px;height:34px;cursor:pointer;color:var(--ink);font-size:16px}
.zoom button+button{border-top:1px solid var(--faint)}

/* graph */
.hull{stroke-width:1;fill-opacity:.075;stroke-opacity:.28;transition:opacity .4s}
.sph-label{font-family:var(--display);font-weight:800;letter-spacing:-.01em;fill-opacity:.9;pointer-events:none;transition:opacity .4s}
.link{fill:none;opacity:.2;transition:opacity .3s}
.link.neg{stroke:var(--neg);stroke-dasharray:4 4;opacity:.42}
.link.hip{stroke-dasharray:2 3}
.link.neg.hip{stroke-dasharray:4 4}
.node circle.ring{fill:#000;stroke-width:1.4}
.node use{pointer-events:none}
.node text{font-size:13px;fill:#CFCAC1;pointer-events:none;paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round}
.node.new circle.ring{stroke-dasharray:3 2}
.node{cursor:pointer;transition:opacity .3s}
.dim .node{opacity:.13}.dim .link{opacity:.04}
.dim .node.on{opacity:1}.dim .link.on{opacity:.95;animation:flow 1.1s linear infinite}
.dim .hull{opacity:.35}
@keyframes flow{to{stroke-dashoffset:-14}}
.dim .link.on:not(.neg):not(.hip){stroke-dasharray:6 3}
.note{font-size:14px;line-height:1.38;pointer-events:none}
.note-wrap{transition:opacity .4s}
.dim .note-wrap{opacity:.15}
.gone{display:none}
@media (prefers-reduced-motion:reduce){.dim .link.on{animation:none}}

/* panel */
.panel{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;display:flex;flex-direction:column}
.p-head{padding:22px 24px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.p-head h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.sec{padding:18px 24px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--mute)}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:16px 0 8px}
.bar i{display:block;height:100%}
.barlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--mute)}
.barlegend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.insights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.insights li{display:grid;grid-template-columns:76px 1fr;gap:12px;font-size:13.5px;line-height:1.42;color:#D5D0C7}
.insights li b{font-family:var(--display);font-size:22px;font-weight:600;color:var(--c);line-height:1.05}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--faint);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;color:var(--ink);font:inherit;font-size:14px;outline:none;min-width:0}
.search svg{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--faint);background:none;border-radius:999px;padding:5px 11px;font-size:12px;color:var(--mute);cursor:pointer}
.chip[aria-pressed=true]{background:#1d1c1a;color:var(--ink);border-color:#55524c}
.count{font-size:12.5px;color:var(--mute);margin:14px 0 2px}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.row:hover .nm{color:#fff}
.av{width:34px;height:34px;border-radius:50%;border:1.3px solid var(--c);display:grid;place-items:center;color:var(--c)}
.nm{font-size:14px;font-weight:500;line-height:1.25;color:var(--ink)}
.sub{font-size:12px;color:var(--mute);line-height:1.35;margin-top:2px}
.rel{font-size:12px;color:#BDB8AF;margin-top:3px}
.w{font-family:var(--display);font-size:15px;font-weight:600;color:var(--c)}
.w.neg{color:var(--neg)}
.tag{display:inline-block;font-size:10.5px;border:1px solid var(--faint);border-radius:4px;padding:1px 5px;margin-left:6px;color:var(--mute);vertical-align:1px}
.tag.doc{border-color:#2f6b5c;color:#7fd9bf}.tag.hip{border-style:dashed}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;font-size:12.5px;color:#C9C4BB}
.legend div{display:flex;align-items:center;gap:8px}
.legend svg{flex:none;color:var(--ink)}
.lines{display:flex;flex-direction:column;gap:7px;margin-top:14px;font-size:12.5px;color:#C9C4BB}
.lines div{display:flex;align-items:center;gap:10px}
.card .kind{font-size:12.5px;color:var(--mute);margin-top:4px}
.card h2{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.1;margin:6px 0 0;letter-spacing:-.01em}
.card p{font-size:13.5px;line-height:1.5;color:#D5D0C7;margin:12px 0 0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;margin-top:14px}
.facts dt{color:var(--mute)}.facts dd{margin:0;color:#D5D0C7}
.back{background:none;border:1px solid var(--faint);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.mini div{border:1px solid var(--line);border-radius:8px;padding:10px}
.mini b{display:block;font-family:var(--display);font-size:22px;font-weight:600}
.mini span{font-size:11.5px;color:var(--mute)}
.foot{padding:18px 24px 30px;font-size:12px;color:var(--mute);line-height:1.5}
.foot a{color:#C9C4BB}
.sphrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#C9C4BB}
.sphrow span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c);vertical-align:-1px}
.mobile-only{display:none}

@media (max-width:900px){
  .node text{font-size:15px;stroke-width:4px}
  .app{display:block;height:auto}
  .stage{height:auto;overflow:visible;background:#000;display:flex;flex-direction:column}
  .masthead{order:0}.controls{order:1}.netbox{order:2}
  .masthead,.controls{position:static;max-width:none;pointer-events:auto;background:none;border-radius:0}
  .netbox{display:flex;flex-direction:column}
  #net{flex:1;height:auto;min-height:0}
  .zoom{position:static;flex-direction:row;align-self:flex-end;margin:8px 12px}
  .zoom button+button{border-top:0;border-left:1px solid var(--faint)}
  .masthead{padding:20px 18px 6px}
  .masthead h1{font-size:28px}
  .controls{padding:10px 18px 12px;gap:8px}
  .seg{width:100%}.seg button{flex:1;padding:8px 6px}
  .netbox{position:relative;height:68vh;min-height:420px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:radial-gradient(circle at 1px 1px,#1b1a18 1px,transparent 1.2px) 0 0/20px 20px,#000}
  .zoom{right:12px;bottom:12px}
  .note-wrap{display:none}
  .panel{border-left:0;overflow:visible}
  .p-head{position:static}
  .sec,.p-head,.foot{padding-left:18px;padding-right:18px}
  .mobile-only{display:block}
}
@media (min-width:901px){.netbox{position:absolute;inset:0}}
</style>
</head>

 <main class="stage">

 </main>

 <aside class="panel" id="panel" aria-live="polite"></aside>

<script>
(function(){
const SPH = {
  hog:{n:'Hogares, trabajo y vivienda',c:'#F4F1EA'},
  gob:{n:'Gobierno local y participación',c:'#86A8FF'},
  sal:{n:'Salud, cuidado y bienestar',c:'#F2829F'},
  edu:{n:'Educación, juventud y espacio público',c:'#B9A0FF'},
  mov:{n:'Movilidad',c:'#D9C49A'},
  cor:{n:'Corabastos y abastecimiento',c:'#F2AE45'},
  res:{n:'Residuos y reciclaje',c:'#B9D44A'},
  amb:{n:'Agua, humedales y ambiente',c:'#3FD4B2'}
};
const RING = ['gob','sal','edu','mov','cor','res','amb'];
const CAT = {
  pub:'Entidad pública',jur:'Persona jurídica o agregado de empresas',org:'Organización o colectivo',ins:'Instancia, comité, asamblea o consejo',
  per:'Personas naturales (grupo)',veh:'Vehículo o equipo',inf:'Infraestructura o espacio',eco:'Ecosistema',var:'Variable ambiental',med:'Canal de comunicación',art:'Artefacto fijo'
};
const NONHUMAN = new Set(['veh','inf','eco','var','art']);
const EVN = {doc:'documentado',ctx:'fuente de contexto',hip:'hipótesis'};
const mobile = () => window.matchMedia('(max-width:900px)').matches;

const nodes = DATA.nodes.map(d=>Object.assign({},d));
const byId = new Map(nodes.map(n=>[n.id,n]));
const links = DATA.links.map(l=>Object.assign({},l,{source:byId.get(l.s),target:byId.get(l.t)}));
nodes.forEach(n=>{n.out=[];n.in=[]});
links.forEach(l=>{l.source.out.push(l);l.target.in.push(l)});
nodes.forEach(n=>{n.deg=n.out.length+n.in.length; n.r=6+Math.sqrt(n.deg)*2.3});

/* ---------- métricas ---------- */
function adjacency(ns, ls){
  const ids=new Set(ns.map(n=>n.id)), adj=new Map(ns.map(n=>[n.id,new Set()]));
  ls.forEach(l=>{ if(ids.has(l.s)&&ids.has(l.t)&&l.s!==l.t){adj.get(l.s).add(l.t);adj.get(l.t).add(l.s);} });
  return adj;
}
function betweenness(adj){
  const V=[...adj.keys()], CB=new Map(V.map(v=>[v,0]));
  for(const s of V){
    const S=[],P=new Map(V.map(v=>[v,[]])),sig=new Map(V.map(v=>[v,0])),d=new Map(V.map(v=>[v,-1]));
    sig.set(s,1);d.set(s,0);const Q=[s];
    while(Q.length){const v=Q.shift();S.push(v);for(const w of adj.get(v)){if(d.get(w)<0){Q.push(w);d.set(w,d.get(v)+1)}if(d.get(w)===d.get(v)+1){sig.set(w,sig.get(w)+sig.get(v));P.get(w).push(v)}}}
    const del=new Map(V.map(v=>[v,0]));
    while(S.length){const w=S.pop();for(const v of P.get(w))del.set(v,del.get(v)+sig.get(v)/sig.get(w)*(1+del.get(w)));if(w!==s)CB.set(w,CB.get(w)+del.get(w))}
  }
  const n=V.length, norm=(n-1)*(n-2); // undirected: each pair counted twice -> /2, normalized by (n-1)(n-2)/2
  V.forEach(v=>CB.set(v,CB.get(v)/norm));
  return CB;
}
function components(adj){
  const seen=new Set(),out=[];
  for(const v of adj.keys()){ if(seen.has(v))continue; const c=[v];seen.add(v); for(let i=0;i<c.length;i++)for(const w of adj.get(c[i]))if(!seen.has(w)){seen.add(w);c.push(w)} out.push(c) }
  return out;
}
function shortest(adj,a,b){
  const prev=new Map([[a,null]]),Q=[a];
  while(Q.length){const v=Q.shift(); if(v===b)break; for(const w of adj.get(v)) if(!prev.has(w)){prev.set(w,v);Q.push(w)}}
  const p=[];let x=b;while(x){p.unshift(x);x=prev.get(x)}return p;
}
const ADJ = adjacency(nodes,links);
const BC = betweenness(ADJ);
nodes.forEach(n=>{n.bc=BC.get(n.id); n.spheres=new Set([...ADJ.get(n.id)].map(i=>byId.get(i).sph)).size});
const rankBC = [...nodes].sort((a,b)=>b.bc-a.bc);
rankBC.forEach((n,i)=>n.rank=i+1);

/* lecturas calculadas a partir de los datos */
const pct = x=>Math.round(x*100);
const top=rankBC[0], second=rankBC[1];
const firstNH = rankBC.find(n=>NONHUMAN.has(n.cat));
const pubBelow = nodes.filter(n=>n.cat==='pub' && n.bc<firstNH.bc).length, pubAll=nodes.filter(n=>n.cat==='pub').length;
const cross = links.filter(l=>l.source.sph!==l.target.sph).length;
const neg = links.filter(l=>l.w<0);
const air = byId.get('ECO07');
const airInNeg = air.in.filter(l=>l.w<0).length, airOutNeg=air.out.filter(l=>l.w<0).length;
const corGov = ['COR01','AGC01','AGC02','ACC01','ACC02','GOV19'];
const localGov = ['GOV01','GOV02','GOV20','INS01','INS03','SOC01','SOC02'];
const corLocal = links.filter(l=>(corGov.includes(l.s)&&localGov.includes(l.t))||(corGov.includes(l.t)&&localGov.includes(l.s))).length;
const pathAC = shortest(ADJ,'GOV01','COR01');
const socNodes = nodes.filter(n=>!NONHUMAN.has(n.cat));
const socAdj = adjacency(socNodes,links);
const isolated = components(socAdj).filter(c=>c.length<4).flat().map(i=>byId.get(i));
const docN = links.filter(l=>l.ev==='doc').length, hipN=links.filter(l=>l.ev==='hip').length;
const fmtList = arr => arr.length<2?arr.join(''):arr.slice(0,-1).join(', ')+' y '+arr[arr.length-1];
const short = n => n.name.replace(/\s*\(.*?\)\s*/g,' ').split('/')[0].trim();

const INSIGHTS = [
  {k:'hub',sph:'hog',big:pct(top.bc)+'%',t:`de los caminos más cortos de la red pasan por ${short(top)}. La red gira alrededor de la población; la ${short(second)}, segunda, media el ${pct(second.bc)}%.`},
  {k:'cor',sph:'cor',big:String(corLocal),t:`vínculos entre el gobierno de Corabastos (asamblea, junta, accionistas, Ministerio) y las instancias locales. La Alcaldía llega a la empresa en ${pathAC.length-1} pasos: ${pathAC.slice(1,-1).map(i=>short(byId.get(i))).join(' y ')}.`},
  {k:'air',sph:'amb',big:String(airInNeg),t:`presiones llegan a aire, ruido y calor (camiones, buses, calles, acopios) y se devuelven como exposición a ${airOutNeg} grupos de población.`},
  {k:'nh',sph:'mov',big:'#'+firstNH.rank,t:`en intermediación: ${short(firstNH)} es el actor no humano más central. Conecta más que ${pubBelow} de las ${pubAll} entidades públicas.`},
  {k:'iso',sph:'edu',big:String(isolated.length),t:`actores quedan sueltos si se quitan las cosas (${fmtList(isolated.map(short))}): se relacionan con Kennedy solo a través de redes, parques o humedales.`},
  {k:'ev',sph:'gob',big:docN+'/'+links.length,t:`vínculos están documentados en una fuente; ${hipN} son hipótesis de modelación que se deben validar en campo.`}
];

/* ---------- layout ---------- */
let W,H,cx,cy,MODE; const center={};
function runLayout(){
  MODE=mobile()?'m':'d';
  if(MODE==='d'){W=1800;H=1200;cx=W/2+40;cy=H/2+40;}else{W=1000;H=1750;cx=W/2;cy=H/2+10;}
  const rx=MODE==='d'?640:330, ry=MODE==='d'?440:690;
  center.hog=[cx,cy];
  RING.forEach((k,i)=>{const a=-Math.PI/2+i*2*Math.PI/RING.length; center[k]=[cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]});
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
  const base=MODE==='d'?7:8, gain=MODE==='d'?2.6:2.9;
  nodes.forEach(n=>{n.r=base+Math.sqrt(n.deg)*gain; const c=center[n.sph];n.x=c[0]+(rnd()-.5)*90;n.y=c[1]+(rnd()-.5)*90;n.vx=n.vy=0});
  const sim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).distance(l=>l.source.sph===l.target.sph?85:170).strength(l=>l.source.sph===l.target.sph?.1:.01))
    .force('charge',d3.forceManyBody().strength(n=>-120-n.deg*7).distanceMax(MODE==='d'?420:300))
    .force('x',d3.forceX(n=>center[n.sph][0]).strength(.2))
    .force('y',d3.forceY(n=>center[n.sph][1]).strength(.2))
    .force('col',d3.forceCollide(n=>n.r+(n.deg>9?24:17)).iterations(3))
    .stop();
  for(let i=0;i<560;i++) sim.tick();
  sim.stop();
}
runLayout();

/* ---------- dibujo ---------- */
const svg=d3.select('#net');
svg.attr('preserveAspectRatio','xMidYMid meet');
const defs=svg.append('defs');
const arrowColors=Object.entries(SPH).map(([k,v])=>[k,v.c]).concat([['neg','#FF5A4E']]);
arrowColors.forEach(([k,c])=>defs.append('marker').attr('id','a-'+k).attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5)
  .attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto').append('path').attr('d','M0,1L9,5L0,9z').attr('fill',c));
const root=svg.append('g');
const gH=root.append('g'), gL=root.append('g'), gN=root.append('g'), gS=root.append('g'), gA=root.append('g');

function linkPath(l){
  const s=l.source,t=l.target,dx=t.x-s.x,dy=t.y-s.y,d=Math.hypot(dx,dy)||1;
  const k=Math.min(.22,40/d+.12), mx=(s.x+t.x)/2-dy*k, my=(s.y+t.y)/2+dx*k;
  const ex=t.x-mx,ey=t.y-my,ed=Math.hypot(ex,ey)||1, tx=t.x-ex/ed*(t.r+4), ty=t.y-ey/ed*(t.r+4);
  const sx0=mx-s.x,sy0=my-s.y,sd=Math.hypot(sx0,sy0)||1, sx=s.x+sx0/sd*(s.r+1), sy=s.y+sy0/sd*(s.r+1);
  return `M${sx},${sy}Q${mx},${my} ${tx},${ty}`;
}
svg.attr('viewBox',`0 0 ${W} ${H}`);
const linkSel=gL.selectAll('path').data(links).join('path')
  .attr('class',l=>'link'+(l.w<0?' neg':'')+(l.ev==='hip'?' hip':''))
  .attr('d',linkPath)
  .attr('stroke',l=>l.w<0?'#FF5A4E':SPH[l.source.sph].c)
  .attr('stroke-width',l=>.5+Math.abs(l.w)*.38)
  .attr('marker-end',l=>`url(#a-${l.w<0?'neg':l.source.sph})`);

const nodeSel=gN.selectAll('g').data(nodes).join('g')
  .attr('class',n=>'node'+(n.new?' new':''))
  .attr('transform',n=>`translate(${n.x},${n.y})`)
  .attr('tabindex',0).attr('role','button').attr('aria-label',n=>n.name);
nodeSel.append('circle').attr('class','ring').attr('r',n=>n.r).attr('stroke',n=>SPH[n.sph].c);
nodeSel.append('use').attr('href',n=>'#i-'+n.cat).attr('width',n=>n.r*1.15).attr('height',n=>n.r*1.15)
  .attr('x',n=>-n.r*.575).attr('y',n=>-n.r*.575).style('color',n=>SPH[n.sph].c);
nodeSel.append('text').attr('class','lbl').attr('y',n=>n.r+(MODE==='d'?14:17)).attr('text-anchor','middle').text(n=>short(n).length>34?short(n).slice(0,32)+'…':short(n));

/* hulls */
const hullLine=d3.line().curve(d3.curveCatmullRomClosed.alpha(.7));
function drawHulls(){
  const data=Object.keys(SPH).map(k=>{
    const ns=nodes.filter(n=>n.sph===k && visible(n)); const pts=[];
    ns.forEach(n=>{const p=n.r+26;for(let a=0;a<12;a++)pts.push([n.x+Math.cos(a/12*2*Math.PI)*p,n.y+Math.sin(a/12*2*Math.PI)*p])});
    const h=pts.length>2?d3.polygonHull(pts):null;
    return {k,h,ns};
  }).filter(d=>d.h);
  gH.selectAll('path').data(data,d=>d.k).join('path').attr('class','hull')
    .attr('d',d=>hullLine(d.h)).attr('fill',d=>SPH[d.k].c).attr('stroke',d=>SPH[d.k].c);
  gS.selectAll('text').data(data,d=>d.k).join('text').attr('class','sph-label')
    .attr('fill',d=>SPH[d.k].c)
    .attr('font-size',MODE==='d'?26:36)
    .attr('text-anchor','middle')
    .each(function(d){
      const ys=d.ns.map(n=>n.y-n.r), xs=d.ns.map(n=>n.x);
      const x=d3.mean(xs), y=(d.k==='hog')? d3.max(d.ns,n=>n.y+n.r)+44 : d3.min(ys)-34;
      const words=SPH[d.k].n.split(' '); const lines=[];let cur='';
      words.forEach(w=>{if((cur+' '+w).trim().length>20){lines.push(cur.trim());cur=w}else cur+=' '+w}); lines.push(cur.trim());
      const lh=MODE==='d'?26:36; d3.select(this).attr('x',x).attr('y',d.k==='hog'?y:y-(lines.length-1)*lh).selectAll('tspan').data(lines).join('tspan').attr('x',x).attr('dy',(l,i)=>i?(MODE==='d'?26:36):0).text(l=>l);
    });
}

/* anotaciones en el lienzo */
function drawNotes(){
  const sel=gA.selectAll('g').data(INSIGHTS).join('g').attr('class','note-wrap');
  sel.each(function(d){
    const ns=nodes.filter(n=>n.sph===d.sph&&visible(n));
    const x0=d3.min(ns,n=>n.x-n.r)-26,x1=d3.max(ns,n=>n.x+n.r)+26,y0=d3.min(ns,n=>n.y-n.r)-26,y1=d3.max(ns,n=>n.y+n.r)+26;
    const right = d.sph==='hog' ? true : center[d.sph][0]>=cx-5;
    let x = right ? x1+14 : x0-14-270, y;
    if(d.sph==='hog'){ x=x1+16; y=y0-10; }
    else if(d.sph==='gob'){ x=x1+18; y=y0+10; }
    else y = (center[d.sph][1]<cy) ? y0+30 : y1-120;
    const g=d3.select(this); g.selectAll('*').remove();
    d.box=[x,y,x+270,y+150];
    const fo=g.append('foreignObject').attr('x',x).attr('y',y).attr('width',270).attr('height',150);
    fo.append('xhtml:div').attr('class','note').style('color',SPH[d.sph].c)
      .html(`<span style="font-family:var(--display);font-weight:600;font-size:21px">${d.big}</span> ${d.t}`);
  });
}
/* ---------- filtros y vistas ---------- */
const state={view:'all',ev:new Set(['doc','ctx','hip']),sel:null,filter:'all',q:''};
const visible=n=>state.view==='all'||!NONHUMAN.has(n.cat);
const linkVisible=l=>visible(l.source)&&visible(l.target)&&state.ev.has(l.ev);
function applyFilters(){
  nodeSel.classed('gone',n=>!visible(n));
  linkSel.classed('gone',l=>!linkVisible(l));
  drawHulls();
  labelPolicy(currentK);
  if(state.sel && !visible(state.sel)) select(null);
  else if(state.sel) highlight(state.sel);
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
  state.view=b.dataset.view; document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  applyFilters(); renderPanel();
}));
document.querySelectorAll('[data-ev]').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.ev; if(state.ev.has(k)&&state.ev.size>1)state.ev.delete(k); else state.ev.add(k);
  document.querySelectorAll('[data-ev]').forEach(x=>x.setAttribute('aria-pressed',state.ev.has(x.dataset.ev)));
  applyFilters();
}));

/* ---------- zoom ---------- */
let currentK=1;
const zoom=d3.zoom().scaleExtent([.5,6]).on('zoom',e=>{root.attr('transform',e.transform);currentK=e.transform.k;labelPolicy(currentK)});
svg.call(zoom).on('dblclick.zoom',null);
function labelPolicy(k){
  const thr = mobile()? (k>2.2?0:k>1.4?7:14) : (k>1.8?0:k>1.2?6:10);
  nodeSel.select('text').style('display',n=>(n.deg>=thr||(state.sel&&(n===state.sel||ADJ.get(state.sel.id).has(n.id))))?null:'none');
}
function fit(dur=650){
  const vis=nodes.filter(visible); const pad=mobile()?30:70;
  const x0=d3.min(vis,n=>n.x-n.r)-pad-(mobile()?0:150),x1=d3.max(vis,n=>n.x+n.r)+pad+(mobile()?0:120),y0=d3.min(vis,n=>n.y-n.r)-pad-(mobile()?50:170),y1=d3.max(vis,n=>n.y+n.r)+pad+(mobile()?40:60);
  let X0=x0,X1=x1,Y0=y0,Y1=y1;
  if(!mobile()) INSIGHTS.forEach(d=>{if(d.box){X0=Math.min(X0,d.box[0]-20);X1=Math.max(X1,d.box[2]+20);Y0=Math.min(Y0,d.box[1]-60);Y1=Math.max(Y1,d.box[3]+60)}});
  // escala en unidades de viewBox
  const k=Math.min(W/(X1-X0),H/(Y1-Y0))*.98;
  const t=d3.zoomIdentity.translate(W/2-k*(X0+X1)/2,H/2-k*(Y0+Y1)/2).scale(k);
  svg.transition().duration(dur).call(zoom.transform,t);
}
document.getElementById('zin').onclick=()=>svg.transition().call(zoom.scaleBy,1.4);
document.getElementById('zout').onclick=()=>svg.transition().call(zoom.scaleBy,1/1.4);
document.getElementById('zfit').onclick=()=>{select(null);fit()};

/* ---------- selección ---------- */
function highlight(n){
  const nb=ADJ.get(n.id);
  svg.classed('dim',true);
  nodeSel.classed('on',d=>d===n||nb.has(d.id));
  linkSel.classed('on',l=>l.source===n||l.target===n);
  gL.selectAll('path.on').raise();
}
function clearHL(){svg.classed('dim',false);nodeSel.classed('on',false);linkSel.classed('on',false)}
function select(n,zoomTo){
  state.sel=n;
  if(n){highlight(n); if(zoomTo){const k=Math.max(currentK,mobile()?2.2:1.7); svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(W/2-k*n.x,H/2-k*n.y).scale(k))}}
  else clearHL();
  labelPolicy(currentK); renderPanel();
  if(n&&mobile()&&zoomTo!=='list') document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'start'});
}
nodeSel.on('mouseenter',(e,n)=>{if(!state.sel)highlight(n)}).on('mouseleave',()=>{if(!state.sel)clearHL()})
  .on('click',(e,n)=>{e.stopPropagation();select(n,true)})
  .on('keydown',(e,n)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n,true)}});
svg.on('click',()=>{if(state.sel)select(null)});

/* ---------- panel ---------- */
const P=document.getElementById('panel');
const icon=(cat,c,s=18)=>`<svg width="${s}" height="${s}" style="color:${c}"><use href="#i-${cat}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const sgn=w=>(w>0?'+':'')+w;
const FILTERS=[['all','Todos'],['pub','Públicos'],['jur','Jurídicos'],['org','Comunitarios'],['ins','Instancias'],['per','Personas'],['nh','No humanos']];
function overview(){
  const vis=nodes.filter(visible), vl=links.filter(linkVisible);
  const byCat=d3.rollups(vis,v=>v.length,n=>NONHUMAN.has(n.cat)?'nh':n.cat).sort((a,b)=>b[1]-a[1]);
  const catColor={pub:'#86A8FF',jur:'#F2AE45',org:'#B9D44A',ins:'#B9A0FF',per:'#F4F1EA',med:'#F2829F',nh:'#3FD4B2'};
  const catName={pub:'Públicos',jur:'Jurídicos',org:'Comunitarios',ins:'Instancias',per:'Personas',med:'Canales',nh:'No humanos'};
  return `
  <div class="p-head"><h2>Lectura de la red</h2></div>
  <section class="sec">
   <div class="stats">
    <div class="stat"><b>${vis.length}</b><span>actores</span></div>
    <div class="stat"><b>${vl.length}</b><span>vínculos dirigidos</span></div>
    <div class="stat"><b>${pct(cross/links.length)}%</b><span>cruzan de esfera</span></div>
   </div>
   <div class="bar">${byCat.map(([k,v])=>`<i style="width:${v/vis.length*100}%;background:${catColor[k]}"></i>`).join('')}</div>
   <div class="barlegend">${byCat.map(([k,v])=>`<span style="--c:${catColor[k]}">${catName[k]} ${v}</span>`).join('')}</div>
  </section>
  <section class="sec">
   <h3>Lo que muestra la red</h3>
   <ul class="insights">${INSIGHTS.map(i=>`<li style="--c:${SPH[i.sph].c}"><b>${i.big}</b><span>${esc(i.t)}</span></li>`).join('')}</ul>
  </section>
  <section class="sec">
   <h3>Actores</h3>
   <label class="search">${'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E8A83" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'}<input id="q" placeholder="Buscar: JAC, Corabastos, camiones…" value="${esc(state.q)}" aria-label="Buscar actor"></label>
   <div class="chips" role="group" aria-label="Filtrar actores">${FILTERS.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${state.filter===k}">${l}</button>`).join('')}</div>
   <div class="count" id="cnt"></div>
   <ul class="list" id="alist"></ul>
  </section>
  <section class="sec">
   <h3>Cómo leer el mapa</h3>
   <div class="legend">${Object.entries(CAT).map(([k,v])=>`<div>${icon(k,'#ECE8E1',18)}<span>${v}</span></div>`).join('')}</div>
   <div class="lines">
    <div><svg width="40" height="8"><path d="M0 4H40" stroke="#ECE8E1" stroke-width="2"/></svg><span>Vínculo positivo; el grosor es la intensidad</span></div>
    <div><svg width="40" height="8"><path d="M0 4H40" stroke="#FF5A4E" stroke-width="2" stroke-dasharray="4 4"/></svg><span>Presión, conflicto o externalidad</span></div>
    <div><svg width="40" height="8"><path d="M0 4H40" stroke="#ECE8E1" stroke-width="1.5" stroke-dasharray="2 3"/></svg><span>Hipótesis sin fuente directa</span></div>
    <div><svg width="40" height="14"><circle cx="20" cy="7" r="6" fill="none" stroke="#ECE8E1" stroke-dasharray="3 2"/></svg><span>Actor añadido en la revisión del Excel</span></div>
   </div>
   <div class="sphrow" style="margin-top:16px">${Object.entries(SPH).map(([k,v])=>`<span style="--c:${v.c}">${v.n}</span>`).join('')}</div>
  </section>
  <div class="foot">Peso de cada vínculo = signo × intensidad (1 a 5). Son valores iniciales para modelar, no mediciones. Datos: <a href="data/red_actores_kennedy_revisada.xlsx">Excel revisado</a> y <a href="data/red_actores_kennedy.json">JSON</a>.</div>`;
}
function actorRows(){
  const q=state.q.trim().toLowerCase();
  const list=nodes.filter(visible).filter(n=>state.filter==='all'||(state.filter==='nh'?NONHUMAN.has(n.cat):n.cat===state.filter))
    .filter(n=>!q||(n.name+' '+(n.tipo||'')+' '+n.id).toLowerCase().includes(q)).sort((a,b)=>b.deg-a.deg);
  document.getElementById('cnt').textContent=list.length+' resultados';
  document.getElementById('alist').innerHTML=list.map(n=>`<li><button class="row" data-id="${n.id}">
    <span class="av" style="--c:${SPH[n.sph].c}">${icon(n.cat,SPH[n.sph].c,18)}</span>
    <span><span class="nm">${esc(n.name)}</span><span class="sub" style="display:block">${esc(CAT[n.cat])}</span></span>
    <span class="w" style="--c:${SPH[n.sph].c}">${n.deg}</span></button></li>`).join('');
}
function detail(n){
  const rows=[...n.out.map(l=>({l,o:l.target,dir:'Hacia'})),...n.in.map(l=>({l,o:l.source,dir:'Desde'}))]
    .filter(r=>visible(r.o)).sort((a,b)=>Math.abs(b.l.w)-Math.abs(a.l.w));
  const c=SPH[n.sph].c;
  return `
  <div class="p-head"><button class="back" id="back">Volver a la red completa</button></div>
  <section class="sec card">
   <span class="av" style="--c:${c};width:44px;height:44px">${icon(n.cat,c,24)}</span>
   <h2>${esc(n.name)}</h2>
   <div class="kind">${esc(CAT[n.cat])}${n.new?' <span class="tag">añadido en revisión</span>':''}</div>
   ${n.fun?`<p>${esc(n.fun)}</p>`:''}
   <div class="mini">
    <div><b>${n.in.length}</b><span>vínculos que recibe</span></div>
    <div><b>${n.out.length}</b><span>vínculos que envía</span></div>
    <div><b>#${n.rank}</b><span>en intermediación</span></div>
   </div>
   <dl class="facts">
    <dt>Esfera</dt><dd>${esc(SPH[n.sph].n)}</dd>
    ${n.nat?`<dt>Naturaleza</dt><dd>${esc(n.nat)}</dd>`:''}
    ${n.esc?`<dt>Escala</dt><dd>${esc(n.esc)}</dd>`:''}
    ${n.zona?`<dt>Ámbito</dt><dd>${esc(n.zona)}</dd>`:''}
    ${n.ev?`<dt>Evidencia</dt><dd>${esc(n.ev)}${n.url?` <a href="${esc(n.url)}" target="_blank" rel="noopener">fuente</a>`:''}</dd>`:''}
   </dl>
  </section>
  <section class="sec">
   <h3>${rows.length} conexiones</h3>
   <ul class="list">${rows.map(({l,o,dir})=>`<li><button class="row" data-id="${o.id}">
     <span class="av" style="--c:${SPH[o.sph].c}">${icon(o.cat,SPH[o.sph].c,18)}</span>
     <span><span class="nm">${esc(o.name)}</span>
      <span class="rel" style="display:block">${dir}: ${esc(l.type)}<span class="tag ${l.ev}">${EVN[l.ev]}</span></span>
      ${l.mec?`<span class="sub" style="display:block">${esc(l.mec)}</span>`:''}</span>
     <span class="w ${l.w<0?'neg':''}" style="--c:${c}">${sgn(l.w)}</span></button></li>`).join('')}</ul>
  </section>`;
}
function renderPanel(){
  if(state.sel){P.innerHTML=detail(state.sel);document.getElementById('back').onclick=()=>{select(null);fit()};}
  else{P.innerHTML=overview();actorRows();
    const q=document.getElementById('q'); q.addEventListener('input',()=>{state.q=q.value;actorRows()});
    P.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.f;P.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));actorRows()});
  }
  P.onclick=e=>{const r=e.target.closest('.row');if(r){select(byId.get(r.dataset.id),'list'); if(!mobile())P.scrollTop=0; else document.querySelector('.netbox').scrollIntoView({behavior:'smooth'});}};
}

/* ---------- arranque ---------- */
document.getElementById('lede').textContent=`Quiénes hacen parte de las dinámicas de la localidad: personas, entidades, empresas, instancias de decisión, vehículos, infraestructuras y ecosistemas. ${nodes.length} actores y ${links.length} vínculos dirigidos.`;
drawHulls(); drawNotes(); renderPanel();
const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!reduce){
  nodeSel.attr('opacity',0).transition().delay(n=>200+Math.hypot(n.x-cx,n.y-cy)*.9).duration(500).attr('opacity',1);
  linkSel.attr('opacity',0).transition().delay(900).duration(900).attr('opacity',1);
  gH.attr('opacity',0).transition().delay(500).duration(1200).attr('opacity',1);
}
requestAnimationFrame(()=>{fit(0);labelPolicy(currentK)});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if((mobile()?'m':'d')!==MODE){runLayout();svg.attr('viewBox',`0 0 ${W} ${H}`);
    nodeSel.attr('transform',n=>`translate(${n.x},${n.y})`);nodeSel.select('circle').attr('r',n=>n.r);
    nodeSel.select('use').attr('width',n=>n.r*1.15).attr('height',n=>n.r*1.15).attr('x',n=>-n.r*.575).attr('y',n=>-n.r*.575);
    nodeSel.select('text').attr('y',n=>n.r+(MODE==='d'?14:17));linkSel.attr('d',linkPath);drawNotes();}
  drawHulls();fit(0)},200)});
window.__net={nodes,links,INSIGHTS,BC,isolated,pathAC,corLocal};
})();
</script>
</body>
