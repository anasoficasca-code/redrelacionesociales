<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red de actores de Kennedy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#EEEAE3;--soft:#B9B4AB;--mute:#7E7A73;--line:#1A1918;--faint:#2E2C29;
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box;font-style:normal}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:1fr 372px;height:100%}
.left{display:grid;grid-template-rows:auto 1fr;min-height:0}
header{padding:26px 32px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.05}
.lede{margin:8px 0 0;font-size:14px;line-height:1.5;color:var(--soft);max-width:58ch}
.nums{display:flex;gap:28px;flex:none}
.nums div{text-align:right}.nums b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1}
.nums span{font-size:12px;color:var(--mute)}
.stage{position:relative;min-height:0;background:radial-gradient(circle at 1px 1px,#171615 1px,transparent 1.3px) 0 0/24px 24px,#000}
#net{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#net:active{cursor:grabbing}
.zoom{position:absolute;right:18px;bottom:18px;display:flex;border:1px solid var(--faint);border-radius:999px;overflow:hidden;background:#000}
.zoom button{background:none;border:0;height:34px;padding:0 14px;cursor:pointer;font-size:13px;color:var(--soft)}
.zoom button+button{border-left:1px solid var(--faint)}
.zoom button:hover{color:var(--ink)}
button:focus-visible{outline:2px solid #9AA4FF;outline-offset:2px}

.hull{fill:#fff;fill-opacity:.028;stroke:#fff;stroke-opacity:.09;stroke-width:1}
.hlabel{fill:#8F8A82;font-weight:600;pointer-events:none;letter-spacing:.01em}
.link{fill:none;stroke-linecap:round;opacity:.42;transition:opacity .3s}
.node{cursor:pointer}
.node .ring{fill:#000;stroke:#E9E5DD;stroke-opacity:.75;transition:stroke .2s}
.node .icon{color:#E9E5DD;pointer-events:none}
.node .halo{fill:none;stroke:#fff;stroke-opacity:0}
.node.new .ring{stroke:#E9E5DD;stroke-dasharray:3 2.2}
.node text{fill:#E6E2DA;font-weight:500;pointer-events:none;paint-order:stroke;stroke:#000;stroke-linejoin:round}
.node,.hull,.hlabel{transition:opacity .3s}
.focus .node{opacity:.14}.focus .link{opacity:.04}.focus .hull{opacity:.45}
.focus .node.on{opacity:1}.focus .link.on{opacity:1}
.node.sel .halo{stroke-opacity:.5}
.node.sel .ring{stroke:#fff;stroke-opacity:1}
.off{display:none}
.particle{pointer-events:none}

.panel{border-left:1px solid var(--line);overflow-y:auto;background:#030303}
.sec{padding:22px 26px;border-bottom:1px solid var(--line)}
.sec h2{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sec .hint{margin:0 0 14px;font-size:12.5px;color:var(--mute);line-height:1.45}
.conv{display:flex;flex-direction:column;gap:2px}
.cv{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:12px;padding:8px 6px;border:0;background:none;text-align:left;border-radius:8px;cursor:pointer}
.cv:hover{background:#0f0e0d}
.cv[aria-pressed=false]{opacity:.32}
.cv .t{font-size:13.5px;color:var(--ink);line-height:1.3}
.cv .n{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:13px;color:var(--soft)}
.types div{display:flex;align-items:center;gap:9px}
.types .dash{width:22px;height:22px;border-radius:50%;border:1.3px dashed #E9E5DD;flex:none}
.spheres{display:flex;flex-wrap:wrap;gap:6px}
.sp{border:1px solid var(--faint);background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--soft);cursor:pointer}
.sp:hover{color:var(--ink);border-color:#4a4743}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--faint);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:14px}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.row:hover .nm{color:#fff}
.av{width:32px;height:32px;border-radius:50%;border:1.2px solid #6d6963;display:grid;place-items:center;color:#E9E5DD}
.nm{display:block;font-size:14px;font-weight:500;line-height:1.25}
.sub{display:block;font-size:12px;color:var(--mute);line-height:1.35;margin-top:2px}
.deg{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.back{background:none;border:1px solid var(--faint);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer}
.who h3{margin:16px 0 0;font-size:22px;font-weight:600;line-height:1.15;letter-spacing:-.015em}
.who .kind{font-size:13px;color:var(--mute);margin-top:6px}
.who p{font-size:14px;line-height:1.5;color:var(--soft);margin:12px 0 0}
.io{display:flex;gap:22px;margin-top:16px}
.io b{font-size:22px;font-weight:600;display:block;line-height:1}.io span{font-size:12px;color:var(--mute)}
.group{margin-top:18px}
.group:first-child{margin-top:0}
.ghead{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--soft);margin-bottom:4px}
.it{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer}
.it .dir{font-size:12px;color:var(--mute)}
.it .who2{font-size:14px;font-weight:500;color:var(--ink);margin-top:1px}
.it .ty{font-size:12.5px;color:var(--soft);margin-top:3px}
.it .ds{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.4}
.dots{display:inline-flex;gap:3px;margin-left:8px;vertical-align:1px}
.dots i{width:5px;height:5px;border-radius:50%;background:#3a3835}.dots i.f{background:var(--c)}
.mob{display:none}

@media (max-width:900px){
  .app{display:block;height:auto}
  .left{display:block}
  header{display:block;padding:22px 18px 14px}
  h1{font-size:27px}
  .nums{margin-top:16px;gap:22px}.nums div{text-align:left}
  .stage{height:72vh;min-height:440px;border-bottom:1px solid var(--line);display:flex;flex-direction:column}
  #net{flex:1;height:auto;min-height:0}
  .zoom{position:static;align-self:flex-end;margin:10px 14px}
  .panel{border-left:0;overflow:visible}
  .sec{padding:20px 18px}
  .mob{display:block}
}
@media (prefers-reduced-motion:reduce){.particle{display:none}}
</style>
</head>

<script>const DATA={"nodes":[{"id":"A01","name":"Corabastos S. A.","nat":"Empresa / persona jurídica","fun":"Administra y coordina actividades comerciales y operativas de la central.","sph":"cor","cat":"emp","short":"Corabastos S.A."},{"id":"A02","name":"Asamblea General de Accionistas de Corabastos","nat":"Órgano de gobierno","fun":"Participa en decisiones societarias de la empresa.","sph":"cor","cat":"ins","short":"Asamblea de accionistas"},{"id":"A03","name":"Junta Directiva de Corabastos","nat":"Órgano de gobierno","fun":"Orienta y supervisa decisiones de administración.","sph":"cor","cat":"ins","short":"Junta Directiva Corabastos"},{"id":"A04","name":"Gerencia y administración de Corabastos","nat":"Unidad administrativa","fun":"Coordina operación, reglas internas y servicios de la central.","sph":"cor","cat":"emp","short":"Gerencia Corabastos"},{"id":"A06","name":"Comerciantes mayoristas de frutas y hortalizas","nat":"Personas / actividad económica","fun":"Venden productos a compradores comerciales y otros comerciantes.","sph":"cor","cat":"per","short":"Mayoristas de frutas y hortalizas"},{"id":"A07","name":"Comerciantes mayoristas de tubérculos, granos y otros abarrotes","nat":"Personas / actividad económica","fun":"Distribuyen productos alimentarios a compradores comerciales.","sph":"cor","cat":"per","short":"Mayoristas de tubérculos y granos"},{"id":"A08","name":"Productores agrícolas y asociaciones proveedoras","nat":"Personas y organizaciones","fun":"Proveen productos agrícolas para su comercialización.","sph":"cor","cat":"per","short":"Productores agrícolas"},{"id":"A09","name":"Intermediarios y comisionistas de productos agrícolas","nat":"Personas / actividad económica","fun":"Negocian compras, ventas o consignación de productos.","sph":"cor","cat":"per","short":"Intermediarios y comisionistas"},{"id":"A10","name":"Empresas transportadoras de alimentos","nat":"Empresa / persona jurídica","fun":"Contratan o coordinan el transporte de carga alimentaria.","sph":"log","cat":"emp","short":"Empresas transportadoras"},{"id":"A11","name":"Conductores de camiones de alimentos","nat":"Personas naturales por rol laboral","fun":"Conducen la carga entre proveedores, central y compradores.","sph":"log","cat":"per","short":"Conductores de camión"},{"id":"A12","name":"Camiones de transporte de alimentos","nat":"Instrumento físico móvil","fun":"Transportan productos alimentarios entre agentes.","sph":"log","cat":"obj","short":"Camiones de alimentos"},{"id":"A13","name":"Coteros y trabajadores de cargue y descargue","nat":"Personas naturales por rol laboral","fun":"Cargan, descargan y movilizan bultos o cajas.","sph":"log","cat":"per","short":"Coteros"},{"id":"A14","name":"Coordinadores de logística y cargue/descargue","nat":"Personas naturales por rol laboral","fun":"Organizan turnos, maniobras o secuencias de cargue y despacho.","sph":"log","cat":"per","short":"Coordinadores de cargue"},{"id":"A15","name":"Tenderos y propietarios de pequeños comercios de alimentos","nat":"Personas / actividad económica","fun":"Compran y venden alimentos al por menor.","sph":"con","cat":"per","short":"Tenderos"},{"id":"A16","name":"Personas encargadas de abastecer tiendas y minimercados","nat":"Personas naturales por rol laboral","fun":"Seleccionan proveedores, hacen pedidos y recogen o reciben productos.","sph":"con","cat":"per","short":"Surtidores de tiendas"},{"id":"A17","name":"Restaurantes y cafeterías","nat":"Establecimientos comerciales","fun":"Compran insumos y venden comidas o bebidas preparadas.","sph":"con","cat":"emp","short":"Restaurantes y cafeterías"},{"id":"A18","name":"Responsables de compras de restaurantes y cafeterías","nat":"Personas naturales por rol laboral","fun":"Eligen proveedores, comparan precios y coordinan pedidos.","sph":"con","cat":"per","short":"Compradores de restaurantes"},{"id":"A19","name":"Vendedores de alimentos preparados","nat":"Personas / actividad económica","fun":"Preparan o venden comidas listas para consumo.","sph":"con","cat":"per","short":"Vendedores de comida preparada"},{"id":"A20","name":"Hogares que compran alimentos para consumo familiar","nat":"Hogares / consumidores","fun":"Compran productos al detal y generan demanda alimentaria.","sph":"con","cat":"hog","short":"Hogares compradores"},{"id":"A21","name":"Repartidores de última milla de alimentos","nat":"Personas naturales por rol laboral","fun":"Entregan pedidos a hogares, tiendas o restaurantes.","sph":"log","cat":"per","short":"Repartidores"},{"id":"A22","name":"Vehículos de reparto de alimentos","nat":"Instrumento físico móvil","fun":"Permiten distribuir pedidos en trayectos cortos.","sph":"log","cat":"obj","short":"Vehículos de reparto"},{"id":"A23","name":"Comercios y restaurantes que generan residuos","nat":"Establecimientos / generadores","fun":"Producen residuos orgánicos, empaques y materiales aprovechables.","sph":"res","cat":"emp","short":"Comercios generadores de residuos"},{"id":"A24","name":"Hogares que separan residuos aprovechables","nat":"Hogares / participantes","fun":"Separan papel, cartón, plástico, vidrio u otros materiales.","sph":"res","cat":"hog","short":"Hogares que separan"},{"id":"A25","name":"Organizaciones de recicladores de oficio","nat":"Organización / persona jurídica o colectivo","fun":"Coordinan actividades, afiliación o comercialización de materiales.","sph":"res","cat":"org","short":"Organizaciones de recicladores"},{"id":"A26","name":"Recicladores de oficio vinculados a una organización","nat":"Personas naturales por rol laboral","fun":"Recogen, seleccionan y entregan materiales aprovechables.","sph":"res","cat":"per","short":"Recicladores asociados"},{"id":"A27","name":"Recicladores de oficio independientes","nat":"Personas naturales por rol laboral","fun":"Recuperan materiales sin estar necesariamente vinculados a una organización.","sph":"res","cat":"per","short":"Recicladores independientes"},{"id":"A28","name":"Empresa operadora del servicio de aseo","nat":"Empresa / persona jurídica","fun":"Organiza o ejecuta labores de recolección y transporte de residuos.","sph":"res","cat":"emp","short":"Operador de aseo"},{"id":"A29","name":"Conductores de camiones recolectores","nat":"Personas naturales por rol laboral","fun":"Conducen vehículos de recolección de residuos.","sph":"res","cat":"per","short":"Conductores recolectores"},{"id":"A30","name":"Camiones de recolección de residuos","nat":"Instrumento físico móvil","fun":"Transportan residuos recogidos hacia los destinos operativos correspondientes.","sph":"res","cat":"obj","short":"Camiones recolectores"},{"id":"A31","name":"Operarios de recolección de residuos","nat":"Personas naturales por rol laboral","fun":"Retiran y cargan residuos durante las rutas de recolección.","sph":"res","cat":"per","short":"Operarios de recolección"},{"id":"A32","name":"UAESP","nat":"Entidad pública distrital","fun":"Participa en la gestión pública de servicios de aseo y aprovechamiento.","sph":"res","cat":"pub","short":"UAESP"},{"id":"A33","name":"Secretaría Distrital de Ambiente","nat":"Entidad pública distrital","fun":"Interviene en asuntos de gestión y control ambiental dentro de sus competencias.","sph":"res","cat":"pub","short":"Secretaría de Ambiente"},{"id":"A34","name":"Alcaldía Local de Kennedy","nat":"Institución pública local","fun":"Canaliza gestiones, programas y respuestas institucionales de escala local.","sph":"gob","cat":"pub","short":"Alcaldía Local"},{"id":"A35","name":"Juntas de Acción Comunal (JAC)","nat":"Organización comunitaria","fun":"Representan intereses colectivos y desarrollan actividades comunitarias.","sph":"gob","cat":"org","short":"Juntas de Acción Comunal"},{"id":"A36","name":"Presidentes y representantes de JAC","nat":"Personas naturales por rol comunitario","fun":"Transmiten solicitudes y coordinan comunicación con entidades y residentes.","sph":"gob","cat":"per","short":"Presidentes de JAC"},{"id":"A37","name":"Residentes que participan en reuniones o presentan casional","w":1,"desc":"Solo si hay puntos de vigilancia próximos a paraderos o accesos. no asumir vínculo general.","c":"esp"},{"s":"A67","t":"A10","type":"Mantenimiento contratado","w":2,"desc":"Los talleres pueden reparar vehículos de carga.","c":"lab"},{"s":"A67","t":"A29","type":"Mantenimiento o reparación eventual","w":1,"desc":"Solo si se documenta que los vehículos usan estos talleres.","c":"lab"},{"s":"A70","t":"A06","type":"Representación y deliberación colectiva","w":2,"desc":"Representa una posible instancia de organización.","c":"par"},{"s":"N01","t":"A34","type":"Control político","w":2,"desc":"La JAL hace seguimiento y control político a la gestión de la Alcaldía Local.","new":true,"c":"gov"},{"s":"A37","t":"N01","type":"Solicitudes y participación","w":1,"desc":"Residentes llevan solicitudes a los ediles.","new":true,"c":"par"},{"s":"N02","t":"A35","type":"Fortalecimiento comunitario","w":2,"desc":"El IDPAC acompaña, capacita y apoya a las juntas de acción comunal.","new":true,"c":"gov"},{"s":"N03","t":"A55","type":"Acompañamiento a vendedores informales","w":2,"desc":"Programas de formalización, ferias y alternativas comerciales para vendedores.","new":true,"c":"gov"},{"s":"A34","t":"N03","type":"Coordinación institucional","w":1,"desc":"Coordinación sobre ocupación del espacio público y economía popular.","new":true,"c":"gov"},{"s":"N04","t":"A58","type":"Atención social","w":2,"desc":"Oferta de atención y acompañamiento a personas habitantes de calle.","new":true,"c":"ser"},{"s":"N05","t":"A45","type":"Dirección y coordinación del sistema de salud","w":3,"desc":"La Secretaría orienta y coordina a la subred.","new":true,"c":"gov"},{"s":"A45","t":"N08","type":"Organización del servicio y trabajo","w":3,"desc":"El hospital es una sede de la subred.","new":true,"c":"lab"},{"s":"A47","t":"N08","type":"Atención sanitaria","w":2,"desc":"Personas remitidas o que acuden a urgencias y consulta especializada.","new":true,"c":"ser"},{"s":"N06","t":"A01","type":"Servicio de acueducto","w":2,"desc":"Suministro de agua y alcantarillado a la central.","new":true,"c":"ser"},{"s":"N06","t":"A23","type":"Servicio de acueducto","w":2,"desc":"Suministro de agua y alcantarillado a comercios y restaurantes.","new":true,"c":"ser"},{"s":"N06","t":"A20","type":"Servicio de acueducto","w":3,"desc":"Suministro de agua y alcantarillado a los hogares.","new":true,"c":"ser"},{"s":"A69","t":"A23","type":"Suministro de agua alternativo","w":1,"desc":"Carrotanques o distribución alterna cuando el servicio falla.","new":true,"c":"com"},{"s":"N07","t":"A02","type":"Gobierno y decisión","w":2,"desc":"La Nación participa entre los accionistas públicos de la sociedad.","new":true,"c":"gov"},{"s":"A58","t":"A57","type":"Venta y entrega de material recuperado","w":2,"desc":"Venden en bodegas el material que recuperan en la calle.","new":true,"c":"rec"},{"s":"A64","t":"A54","type":"Formación académica","w":3,"desc":"Estudiantes que viven en Kennedy y estudian en la universidad pública.","new":true,"c":"ser"},{"s":"A65","t":"A40","type":"Coordinación o regulación educativa, según competencia","w":2,"desc":"La Secretaría orienta a los colegios oficiales e inspecciona a los privados.","new":true,"c":"gov"},{"s":"A60","t":"A59","type":"Contratación y asignación de trabajo","w":2,"desc":"Administradores de bodegas contratan o coordinan la vigilancia.","new":true,"c":"lab"},{"s":"A38","t":"A39","type":"Coordinación institucional","w":1,"desc":"Policía e inspecciones actúan juntas en casos de convivencia.","new":true,"c":"gov"}]};</script>
<script>
(function(){
const CONV={
 com:{n:'Compra, venta y suministro',c:'#F3B54A',d:null},
 lab:{n:'Trabajo y contratación',c:'#FF806B',d:null},
 fis:{n:'Vehículos, carga y objetos',c:'#6CD2FF',d:null},
 ser:{n:'Prestación de un servicio',c:'#62E2A2',d:null},
 rec:{n:'Reciclaje y material aprovechable',c:'#C8E15C',d:null},
 gov:{n:'Gobierno, coordinación y control',c:'#9EA7FF',d:'8 5'},
 par:{n:'Participación y solicitudes',c:'#EE8DEB',d:'1 5'},
 esp:{n:'Coinciden en el mismo espacio',c:'#8C8780',d:'1 7'}
};
const SPH={cor:'Corabastos y comercio mayorista',log:'Logística y transporte de carga',con:'Comercio barrial y consumo',res:'Residuos, reciclaje y agua',gob:'Gobierno local y comunidad',edu:'Educación',sal:'Salud',mov:'Transporte público'};
const RING=['log','res','gob','sal','edu','mov','con'];
const TYPES={pub:'Entidad pública',emp:'Empresa o establecimiento',ins:'Órgano, comité o asamblea',org:'Organización comunitaria',per:'Personas por su rol',hog:'Hogares y usuarios',obj:'Vehículo u objeto'};
const mobile=()=>window.matchMedia('(max-width:900px)').matches;
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

const nodes=DATA.nodes.map(d=>({...d})), byId=new Map(nodes.map(n=>[n.id,n]));
const links=DATA.links.map((l,i)=>({...l,i,source:byId.get(l.s),target:byId.get(l.t)}));
nodes.forEach(n=>{n.out=[];n.in=[]});links.forEach(l=>{l.source.out.push(l);l.target.in.push(l)});
nodes.forEach(n=>{n.deg=n.in.length+n.out.length;n.nb=new Set([...n.out.map(l=>l.t),...n.in.map(l=>l.s)])});
document.getElementById('nA').textContent=nodes.length;document.getElementById('nL').textContent=links.length;

/* ---------- layout ---------- */
let W,H,MODE;const center={};
function layout(){
  MODE=mobile()?'m':'d';
  if(MODE==='d'){W=1600;H=1060}else{W=900;H=1640}
  const cx=W/2,cy=H/2,rx=MODE==='d'?580:250,ry=MODE==='d'?390:660;
  center.cor=[cx,cy];
  RING.forEach((k,i)=>{const a=-Math.PI/2+(i+.5)*2*Math.PI/RING.length;center[k]=[cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]});
  let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
  nodes.forEach(n=>{n.r=(MODE==='d'?10:12)+Math.sqrt(n.deg)*(MODE==='d'?3:3.4);const c=center[n.sph];n.x=c[0]+(rnd()-.5)*60;n.y=c[1]+(rnd()-.5)*60;n.vx=n.vy=0});
  const sim=d3.forceSimulation(nodes)
   .force('l',d3.forceLink(links).distance(l=>l.source.sph===l.target.sph?78:220).strength(l=>l.source.sph===l.target.sph?.16:.015))
   .force('q',d3.forceManyBody().strength(-260).distanceMax(320))
   .force('x',d3.forceX(n=>center[n.sph][0]).strength(.13))
   .force('y',d3.forceY(n=>center[n.sph][1]).strength(.13))
   .force('c',d3.forceCollide(n=>n.r+(MODE==='d'?19:14)).iterations(4)).stop();
  for(let i=0;i<600;i++)sim.tick();
}
layout();

/* ---------- svg ---------- */
const svg=d3.select('#net').attr('preserveAspectRatio','xMidYMid meet');
const defs=svg.append('defs');
Object.entries(CONV).forEach(([k,v])=>defs.append('marker').attr('id','m-'+k).attr('viewBox','0 0 10 10').attr('refX',8).attr('refY',5)
  .attr('markerWidth',4.2).attr('markerHeight',4.2).attr('orient','auto').attr('markerUnits','strokeWidth')
  .append('path').attr('d','M0,1.2L9,5L0,8.8z').attr('fill',v.c));
const root=svg.append('g');
const gH=root.append('g'),gL=root.append('g'),gP=root.append('g'),gN=root.append('g'),gT=root.append('g');

function path(l){
  const s=l.source,t=l.target,dx=t.x-s.x,dy=t.y-s.y,d=Math.hypot(dx,dy)||1;
  const back=links.some(o=>o.s===l.t&&o.t===l.s);
  const k=back?.16:.08,mx=(s.x+t.x)/2-dy*k,my=(s.y+t.y)/2+dx*k;
  const ex=t.x-mx,ey=t.y-my,ed=Math.hypot(ex,ey)||1,sx0=mx-s.x,sy0=my-s.y,sd=Math.hypot(sx0,sy0)||1;
  const pad=6;
  return `M${s.x+sx0/sd*(s.r+2)},${s.y+sy0/sd*(s.r+2)}Q${mx},${my} ${t.x-ex/ed*(t.r+pad)},${t.y-ey/ed*(t.r+pad)}`;
}
const wid=w=>MODE==='d'?[0,1.1,1.9,2.9][w]:[0,1.6,2.6,3.8][w];
const linkSel=gL.selectAll('path').data(links).join('path').attr('class','link')
  .attr('id',l=>'p'+l.i).attr('stroke',l=>CONV[l.c].c).attr('stroke-dasharray',l=>CONV[l.c].d)
  .attr('marker-end',l=>`url(#m-${l.c})`);
const nodeSel=gN.selectAll('g').data(nodes).join('g').attr('class',n=>'node'+(n.new?' new':''))
  .attr('tabindex',0).attr('role','button').attr('aria-label',n=>n.name);
nodeSel.append('circle').attr('class','halo');
nodeSel.append('circle').attr('class','ring');
nodeSel.append('use').attr('class','icon').attr('href',n=>'#i-'+n.cat);
nodeSel.append('text');

function geometry(){
  svg.attr('viewBox',`0 0 ${W} ${H}`);
  linkSel.attr('d',path).attr('stroke-width',l=>wid(l.w));
  nodeSel.attr('transform',n=>`translate(${n.x},${n.y})`);
  nodeSel.select('.ring').attr('r',n=>n.r).attr('stroke-width',MODE==='d'?1.3:1.8);
  nodeSel.select('.halo').attr('r',n=>n.r+7).attr('stroke-width',MODE==='d'?6:8);
  nodeSel.select('.icon').attr('width',n=>n.r*1.05).attr('height',n=>n.r*1.05).attr('x',n=>-n.r*.525).attr('y',n=>-n.r*.525);
  const line=d3.line().curve(d3.curveCatmullRomClosed.alpha(.8));
  const hulls=Object.keys(SPH).map(k=>{const pts=[];nodes.filter(n=>n.sph===k).forEach(n=>{const p=n.r+30;for(let a=0;a<14;a++)pts.push([n.x+Math.cos(a/14*6.283)*p,n.y+Math.sin(a/14*6.283)*p])});
    const h=d3.polygonHull(pts);return {k,h,top:d3.min(h,p=>p[1]),bot:d3.max(h,p=>p[1]),cx:d3.mean(h,p=>p[0])}});
  gH.selectAll('path').data(hulls).join('path').attr('class','hull').attr('d',d=>line(d.h));
  gT.selectAll('text').data(hulls).join('text').attr('class','hlabel').attr('text-anchor','middle').text(d=>SPH[d.k])
    .each(function(d){const below=center[d.k][1]>H/2+40;d.ly=below?d.bot+22:d.top-12;d3.select(this).attr('x',d.cx).attr('y',d.ly)});
}
geometry();

/* ---------- etiquetas sin superposición ---------- */
const meas=document.createElement('canvas').getContext('2d');
let T=d3.zoomIdentity;
function unitPx(){const r=svg.node().getBoundingClientRect();return Math.min(r.width/W,r.height/H)}
function offs(){const r=svg.node().getBoundingClientRect(),u=unitPx();return [(r.width-W*u)/2,(r.height-H*u)/2]}
function placeLabels(){
  const u=unitPx()*T.k, fs=mobile()?11:12.5, fu=fs/u;
  meas.font=`500 ${fs}px "Instrument Sans", sans-serif`;
  const R=svg.node().getBoundingClientRect(), boxes=[], out=b=>b[0]<4||b[1]<4||b[2]>R.width-4||b[3]>R.height-4, ov=(a,o)=>a[0]<o[2]&&a[2]>o[0]&&a[1]<o[3]&&a[3]>o[1], nb=[], hit=(b,soft)=>out(b)||boxes.some(o=>ov(b,o))||(!soft&&nb.some(o=>ov(b,o)));
  const O=offs(), sx=n=>(n.x*T.k+T.x)*unitPx()+O[0], sy=n=>(n.y*T.k+T.y)*unitPx()+O[1];
  const vis=nodes.filter(n=>!n.hidden);
  vis.filter(n=>!state.sel||n===state.sel||state.sel.nb.has(n.id)).forEach(n=>{const r=n.r*u,x=sx(n),y=sy(n);nb.push([x-r,y-r,x+r,y+r])});
  // centros de pantalla: unitPx asume meet; corrige el desplazamiento del viewBox centrado

  // etiquetas de ámbito primero
  const hs=Math.max(11,Math.min(15,13)), hu=hs/u;
  meas.font=`600 ${hs}px "Instrument Sans", sans-serif`;
  gT.selectAll('text').attr('font-size',hu).each(function(d){
    const w=meas.measureText(SPH[d.k]).width, x=(d.cx*T.k+T.x)*unitPx()+O[0], y=(d.ly*T.k+T.y)*unitPx()+O[1];
    const b=[x-w/2-4,y-hs,x+w/2+4,y+4]; const ok=!state.sel&&!hit(b,true); if(ok)boxes.push(b); d3.select(this).style('display',ok?null:'none');
  });
  meas.font=`500 ${fs}px "Instrument Sans", sans-serif`;
  const sel=state.sel, prio=n=>(sel&&(n===sel?3:sel.nb.has(n.id)?2:0))+(n===state.hov?3:0);
  const order=[...vis].sort((a,b)=>prio(b)-prio(a)||b.deg-a.deg);
  const shown=new Map();
  order.forEach(n=>{
    if(sel&&!(n===sel||sel.nb.has(n.id)))return;
    const w=meas.measureText(n.short).width,r=n.r*u,x=sx(n),y=sy(n),g=5;
    const cand=[[x+r+g,y-fs/2-1,'start',r+g,fs*.36],[x-r-g-w,y-fs/2-1,'end',-(r+g),fs*.36],[x-w/2,y+r+g,'middle',0,r+g+fs*.82],[x-w/2,y-r-g-fs,'middle',0,-(r+g)-fs*.2]];
    const soft=(!sel&&n.deg>=9)||n===sel||n===state.hov;
    for(const [bx,by,anc,dx,dy] of cand){const b=[bx-2,by-1,bx+w+2,by+fs+2];
      if(!hit(b,soft)){boxes.push(b);shown.set(n,[anc,dx/u,dy/u]);break}}
  });
  nodeSel.select('text').each(function(n){const s=shown.get(n),t=d3.select(this);
    if(!s){t.style('display','none');return}
    t.style('display',null).attr('text-anchor',s[0]).attr('x',s[1]).attr('y',s[2]).attr('font-size',fu).attr('stroke-width',3/u).text(n.short)});
}
let raf;const queue=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(placeLabels)};

/* ---------- zoom ---------- */
const zoom=d3.zoom().scaleExtent([.6,6]).on('zoom',e=>{T=e.transform;root.attr('transform',T);queue()});
svg.call(zoom).on('dblclick.zoom',null);
function fitTo(ns,dur=700,maxK=3){
  const pad=MODE==='d'?50:24, px=MODE==='d'?120:40;
  const x0=d3.min(ns,n=>n.x-n.r)-px,x1=d3.max(ns,n=>n.x+n.r)+px,y0=d3.min(ns,n=>n.y-n.r)-pad-28,y1=d3.max(ns,n=>n.y+n.r)+pad+28;
  const k=Math.min(maxK,W/(x1-x0),H/(y1-y0));
  svg.transition().duration(dur).call(zoom.transform,d3.zoomIdentity.translate(W/2-k*(x0+x1)/2,H/2-k*(y0+y1)/2).scale(k));
}
const fitAll=(d=700)=>fitTo(nodes.filter(n=>!n.hidden),d,1.4);
document.getElementById('zin').onclick=()=>svg.transition().call(zoom.scaleBy,1.4);
document.getElementById('zout').onclick=()=>svg.transition().call(zoom.scaleBy,1/1.4);
document.getElementById('zfit').onclick=()=>{select(null);fitAll()};

/* ---------- estado, filtros, selección ---------- */
const state={sel:null,hov:null,conv:new Set(Object.keys(CONV)),q:''};
function applyConv(){
  linkSel.classed('off',l=>!state.conv.has(l.c));
  nodes.forEach(n=>n.hidden=false);
  if(state.sel)focus(state.sel);
  queue();
}
function focus(n){
  svg.classed('focus',!!n);
  nodeSel.classed('on',d=>n&&(d===n||n.nb.has(d.id))).classed('sel',d=>d===n);
  linkSel.classed('on',l=>n&&(l.source===n||l.target===n));
  gP.selectAll('*').remove();
  if(n&&!window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    [...n.out,...n.in].filter(l=>state.conv.has(l.c)).forEach((l,j)=>{
      for(let q=0;q<2;q++){
        const c=gP.append('circle').attr('class','particle').attr('r',MODE==='d'?2.6:3.4).attr('fill',CONV[l.c].c);
        c.append('animateMotion').attr('dur',(2.4+(j%3)*.3)+'s').attr('repeatCount','indefinite').attr('begin',(q*1.2+j*.07)+'s')
         .append('mpath').attr('href','#p'+l.i);
      }
    });
  }
}
function select(n,how){
  state.sel=n;focus(n);renderPanel();queue();
  if(n&&how!=='keep'){fitTo([n,...[...n.nb].map(i=>byId.get(i))],650,2.4)}
  if(n&&mobile()&&how==='node')document.getElementById('panel').scrollIntoView({behavior:'smooth'});
}
nodeSel.on('mouseenter',(e,n)=>{state.hov=n;if(!state.sel){focus(n)}queue()})
 .on('mouseleave',()=>{state.hov=null;if(!state.sel)focus(null);queue()})
 .on('click',(e,n)=>{e.stopPropagation();select(n,'node')})
 .on('keydown',(e,n)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n,'node')}});
svg.on('click',()=>{if(state.sel){select(null,'keep')}});

/* ---------- panel ---------- */
const P=document.getElementById('panel');
const ic=(cat,s=18)=>`<svg width="${s}" height="${s}"><use href="#i-${cat}"/></svg>`;
const sample=(k,w=46)=>`<svg width="${w}" height="12" aria-hidden="true"><path d="M2 6H${w-9}" stroke="${CONV[k].c}" stroke-width="2.4" stroke-linecap="round" ${CONV[k].d?`stroke-dasharray="${CONV[k].d}"`:''}/><path d="M${w-10} 2.2 ${w-2} 6 ${w-10} 9.8z" fill="${CONV[k].c}"/></svg>`;
const dots=(w,c)=>`<span class="dots" style="--c:${c}" title="Intensidad ${w} de 3">${[1,2,3].map(i=>`<i class="${i<=w?'f':''}"></i>`).join('')}</span>`;
function overview(){
  const counts=d3.rollup(links,v=>v.length,l=>l.c);
  return `
  <section class="sec"><h2>Convenciones de interacción</h2>
   <p class="hint">Color y trazo dicen qué tipo de relación es; el grosor, qué tan fuerte. Toca una convención para ocultarla o mostrarla.</p>
   <div class="conv">${Object.entries(CONV).map(([k,v])=>`<button class="cv" data-c="${k}" aria-pressed="${state.conv.has(k)}">${sample(k)}<span class="t">${v.n}</span><span class="n">${counts.get(k)||0}</span></button>`).join('')}</div>
   <div class="conv" style="margin-top:12px;font-size:12.5px;color:var(--mute);gap:8px">
    <div style="display:flex;align-items:center;gap:12px"><svg width="46" height="12"><path d="M2 6H44" stroke="#8C8780" stroke-width="1.1"/></svg>Débil</div>
    <div style="display:flex;align-items:center;gap:12px"><svg width="46" height="12"><path d="M2 6H44" stroke="#8C8780" stroke-width="3"/></svg>Fuerte</div>
   </div>
  </section>
  <section class="sec"><h2>Tipos de actor</h2><p class="hint">El tamaño del círculo crece con el número de interacciones.</p>
   <div class="types">${Object.entries(TYPES).map(([k,v])=>`<div><span class="av" style="width:28px;height:28px">${ic(k,15)}</span>${v}</div>`).join('')}
   <div><span class="dash"></span>Añadido a tu Excel</div></div>
  </section>
  <section class="sec"><h2>Ámbitos</h2><p class="hint">Acerca la red a un grupo de actores.</p>
   <div class="spheres">${Object.entries(SPH).map(([k,v])=>`<button class="sp" data-s="${k}">${v}</button>`).join('')}</div>
  </section>
  <section class="sec"><h2>Actores</h2>
   <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7E7A73" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar actor" value="${esc(state.q)}" aria-label="Buscar actor"></label>
   <ul class="list" id="al"></ul>
  </section>`;
}
function actorList(){
  const q=state.q.trim().toLowerCase();
  document.getElementById('al').innerHTML=nodes.filter(n=>!q||(n.name+' '+n.short).toLowerCase().includes(q)).sort((a,b)=>b.deg-a.deg)
   .map(n=>`<li><button class="row" data-id="${n.id}"><span class="av">${ic(n.cat)}</span><span><span class="nm">${esc(n.short)}</span><span class="sub">${esc(n.name!==n.short?n.name:TYPES[n.cat])}</span></span><span class="deg">${n.deg}</span></button></li>`).join('');
}
function detail(n){
  const rows=[...n.out.map(l=>({l,o:l.target,d:'Hacia'})),...n.in.map(l=>({l,o:l.source,d:'Desde'}))];
  const groups=Object.keys(CONV).map(k=>[k,rows.filter(r=>r.l.c===k)]).filter(g=>g[1].length);
  return `
  <section class="sec"><button class="back" id="back">Volver a toda la red</button>
   <div class="who"><h3>${esc(n.name)}</h3><div class="kind">${esc(n.nat)}</div><div class="kind" style="margin-top:2px">Ámbito: ${esc(SPH[n.sph])}</div>
   <p>${esc(n.fun)}</p>
   <div class="io"><div><b>${n.out.length}</b><span>relaciones que inicia</span></div><div><b>${n.in.length}</b><span>relaciones que recibe</span></div></div></div>
  </section>
  <section class="sec">${groups.map(([k,rs])=>`<div class="group"><div class="ghead">${sample(k,34)}${CONV[k].n}</div>
   ${rs.map(({l,o,d})=>`<button class="it" data-id="${o.id}"><div class="dir">${d}</div><div class="who2">${esc(o.name)}</div>
    <div class="ty">${esc(l.type)}${dots(l.w,CONV[k].c)}</div><div class="ds">${esc(l.desc)}</div></button>`).join('')}</div>`).join('')}
  </section>`;
}
function renderPanel(){
  if(state.sel){P.innerHTML=detail(state.sel);document.getElementById('back').onclick=()=>{select(null,'keep');fitAll()};P.scrollTop=0}
  else{P.innerHTML=overview();actorList();
   const q=document.getElementById('q');q.oninput=()=>{state.q=q.value;actorList()};
   P.querySelectorAll('.cv').forEach(b=>b.onclick=()=>{const k=b.dataset.c;state.conv.has(k)?state.conv.delete(k):state.conv.add(k);b.setAttribute('aria-pressed',state.conv.has(k));applyConv()});
   P.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{fitTo(nodes.filter(n=>n.sph===b.dataset.s),700,2.6);if(mobile())document.querySelector('.stage').scrollIntoView({behavior:'smooth'})});
  }
  P.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{select(byId.get(b.dataset.id),'list');if(mobile())document.querySelector('.stage').scrollIntoView({behavior:'smooth'})});
}

/* ---------- inicio ---------- */
renderPanel();
const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!reduce){
  gH.attr('opacity',0).transition().duration(1200).attr('opacity',1);
  nodeSel.attr('opacity',0).transition().delay(n=>120+Math.hypot(n.x-W/2,n.y-H/2)*.8).duration(450).attr('opacity',1);
  linkSel.style('opacity',0).transition().delay(700).duration(900).style('opacity',null);
}
requestAnimationFrame(()=>{fitAll(0);document.fonts&&document.fonts.ready.then(queue)});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if((mobile()?'m':'d')!==MODE){layout();geometry();if(state.sel)focus(state.sel)}
  fitAll(0)},180)});
window.__net={nodes,links};
})();
</script>
</body>
</html>
