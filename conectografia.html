<title>Conectografía de la propuesta · Kennedy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F2EC;--ink:#141414;--soft:#55524B;--mute:#8A867C;--line:#D9D5CB;--red:#C8322B;--blue:#2F4FA8;--green:#2E8B57;--ui:'Instrument Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box;font-style:normal}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--paper)}
header h1{margin:0;font-size:19px;letter-spacing:-.01em}
header .k{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.ctr{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.ctr button{border:1px solid #cfcabd;background:#fff;color:var(--soft);border-radius:999px;padding:7px 13px;font:600 12.5px var(--ui);cursor:pointer}
.ctr button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctr .sep{width:1px;background:var(--line);margin:0 4px}
main{position:relative;min-height:0;overflow-y:auto}
#cg{width:100%;display:block;max-width:1400px;margin:0 auto}
.lbl{font:600 17px var(--ui);fill:var(--ink)}
.lyr{font:600 17px var(--mono);letter-spacing:.06em;fill:#4a473f;text-transform:uppercase}
.small{font:500 14px var(--ui);fill:var(--soft)}
.note{padding:10px 20px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--soft);background:#EFECE4}
.note b{color:var(--ink)}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;gap:6px}
.zoom button{border:1px solid #cfcabd;background:#fff;border-radius:8px;padding:6px 11px;font:600 13px var(--ui);cursor:pointer;color:var(--soft)}
@media (max-width:760px){
 body{height:auto;display:block}html,body{height:auto}
 main{height:auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
 #cg{min-width:1050px;max-width:none}
 .note{font-size:14.5px}
 .ctr{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
